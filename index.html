<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>《开！》大厅</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- 字体自托管（fonts/ShareTechMono.woff2，OFL）：不走 fonts.googleapis.com——大陆不可达且会挂住整页。
     汉字一律用系统字，不打包中文字体。 -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<div id="app">
  <div id="tubeViewport" class="tube-viewport mx hidden" aria-label="《开！》数字雨对局界面">
    <div id="tubeStage" class="mx-rain" aria-hidden="true"></div>
    <div class="mx-ui">
      <header class="mx-bar">
        <div class="mx-logo"><b>开！</b><small id="mxTagline"></small></div>
        <button id="tubeMenuBtn" class="mx-icon" type="button" aria-label="菜单">≡</button>
      </header>
      <section class="mx-panel mx-opp" aria-labelledby="mxOppName">
        <div class="mx-ph">
          <span class="mx-name" id="mxOppName"></span>
          <span class="mx-live" id="mxOppState"></span>
          <span class="mx-acct" id="mxOppAcct"></span>
        </div>
        <div class="mx-dice mx-dice--opp" id="mxOppDice"></div>
        <div id="tubeSpeech" class="tube-speech hidden" data-raw tabindex="0" aria-label="AI 台词"></div>
        <span class="mx-ai-tag" id="mxAiTag"></span>
      </section>
      <section class="mx-stage" aria-live="off">
        <div class="mx-lbl" id="mxBidLbl"></div>
        <div class="mx-bid" id="mxBid">
          <canvas id="mxBidCount" aria-hidden="true"></canvas>
          <span class="mx-bid-x" id="mxBidX"></span>
          <canvas id="mxBidFace" aria-hidden="true"></canvas>
          <canvas id="mxVerdictWord" class="mx-verdict-word" aria-hidden="true"></canvas>
        </div>
        <div class="mx-rel" id="mxRel"></div>
        <div class="mx-hud" id="mxHud"></div>
      </section>
      <section class="mx-panel mx-mine">
        <div class="mx-ph">
          <span class="mx-name" id="mxMyName"></span>
          <span class="mx-round" id="mxRound"></span>
          <span class="mx-acct" id="mxMyAcct"></span>
        </div>
        <div class="mx-dice mx-dice--mine" id="mxMyDice"></div>
        <button id="tubePeekBtn" class="mx-peek" type="button" aria-label="看自己的骰子"></button>
      </section>
      <div class="mx-ctl">
        <div class="mx-faces">
          <button id="tubeFace1Btn" class="mx-key mx-face" type="button" data-face="1" aria-label="选择一点"></button>
          <button id="tubeFace2Btn" class="mx-key mx-face" type="button" data-face="2" aria-label="选择二点"></button>
          <button id="tubeFace3Btn" class="mx-key mx-face" type="button" data-face="3" aria-label="选择三点"></button>
          <button id="tubeFace4Btn" class="mx-key mx-face" type="button" data-face="4" aria-label="选择四点"></button>
          <button id="tubeFace5Btn" class="mx-key mx-face" type="button" data-face="5" aria-label="选择五点"></button>
          <button id="tubeFace6Btn" class="mx-key mx-face" type="button" data-face="6" aria-label="选择六点"></button>
        </div>
        <div class="mx-step">
          <button id="tubeCountDownBtn" class="mx-key" type="button" aria-label="减少报价数量">−</button>
          <div class="mx-count" id="mxCount"></div>
          <button id="tubeCountUpBtn" class="mx-key" type="button" aria-label="增加报价数量">+</button>
        </div>
        <div class="mx-decl">
          <button id="tubeBlindBtn" class="mx-tog" type="button" aria-label="宣盲"></button>
          <button id="tubeZhaiBtn" class="mx-tog" type="button" aria-label="宣斋"></button>
          <button id="tubeRaiseBtn" class="mx-tog" type="button" aria-label="宣抬"></button>
          <button id="mxMoreBtn" class="mx-tog mx-tog--more" type="button" aria-expanded="false"></button>
        </div>
        <div class="mx-extra hidden" id="mxExtra"></div>
        <div class="mx-pills">
          <button id="tubeBidBtn" class="mx-pill mx-pill--blue" type="button" aria-label="报数"><b></b><small></small></button>
          <button id="tubeOpenBtn" class="mx-pill mx-pill--red" type="button" aria-label="开"><b></b><small></small></button>
        </div>
      </div>
    </div>
    <div id="tubeA11y" class="sr-only" aria-live="polite" data-raw></div>
  </div>
  <header>
    <div class="who">
      <span id="roundTag"></span>
      <div class="seal" id="seal"></div>
      <div class="name" id="oppName"></div>
      <span class="brain hidden" id="brainDot"></span>
      <button id="menuBtn" aria-label="菜单">☰</button>
    </div>
    <div id="duoOpp">
      <div class="dicerow mirror" id="oppDice"></div>
      <div class="meta-line"><span class="chips" id="oppChips"></span></div>
    </div>
    <div id="trioOpp" class="hidden"></div>
    <div class="bubble hidden" id="bubble"></div>
  </header>

  <main>
    <div id="pot"></div>
    <div id="potChips"></div>
    <div id="bidBig"></div>
    <div id="hint"></div>
    <div id="modRow"></div>
    <div id="declareRow">
      <button class="stamp" id="blindBtn">盲</button>
      <button class="stamp" id="zhaiBtn">斋</button>
      <button class="stamp" id="raiseBtn">抬</button>
    </div>
  </main>

  <footer>
    <div class="meta-line"><span class="chips" id="myChips"></span></div>
    <div class="dicerow mirror" id="myDice"></div>
    <div id="pickRow">
      <div class="stepper">
        <button id="cntDown">−</button>
        <span class="val" id="cntVal">2</span>
        <button id="cntUp">＋</button>
      </div>
      <div id="facePick"></div>
    </div>
    <div id="actionRow">
      <button class="primary" id="bidBtn">报</button>
      <button class="danger" id="openBtn">开</button>
    </div>
  </footer>

  <div id="overlay" class="hidden"></div>
  <div id="drawer" class="hidden"></div>
  <div id="lobbyRain" class="lobby-rain hidden" aria-hidden="true"></div>
  <div id="lobby" class="hidden"></div>
</div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
