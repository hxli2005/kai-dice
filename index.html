<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050608">
<meta name="color-scheme" content="dark">
<title>《开！》大厅</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tomorrow:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<div id="app">
  <div id="tubeViewport" class="tube-viewport hidden" aria-label="《开！》三管机对局界面">
    <button id="tubeMenuBtn" class="tube-window-menu" aria-label="菜单">☰</button>
    <div class="tube-stage-frame">
      <canvas id="tubeStage" width="780" height="1688" aria-hidden="true"></canvas>
      <div id="tubeHitLayer" class="tube-hit-layer" aria-label="三管机操作">
        <button id="tubePeekBtn" class="tube-hit peek" aria-label="看自己的骰子"></button>
        <button id="tubeFace1Btn" class="tube-hit face-1" aria-label="选择一点"></button>
        <button id="tubeFace2Btn" class="tube-hit face-2" aria-label="选择二点"></button>
        <button id="tubeFace3Btn" class="tube-hit face-3" aria-label="选择三点"></button>
        <button id="tubeFace4Btn" class="tube-hit face-4" aria-label="选择四点"></button>
        <button id="tubeFace5Btn" class="tube-hit face-5" aria-label="选择五点"></button>
        <button id="tubeFace6Btn" class="tube-hit face-6" aria-label="选择六点"></button>
        <button id="tubeCountDownBtn" class="tube-hit count-down" aria-label="减少报价数量"></button>
        <button id="tubeCountUpBtn" class="tube-hit count-up" aria-label="增加报价数量"></button>
        <button id="tubeBidBtn" class="tube-hit bid" aria-label="报数"></button>
        <button id="tubeOpenBtn" class="tube-hit open" aria-label="开"></button>
        <button id="tubeBlindBtn" class="tube-hit blind" aria-label="宣盲"></button>
        <button id="tubeZhaiBtn" class="tube-hit zhai" aria-label="宣斋"></button>
        <button id="tubeRaiseBtn" class="tube-hit raise" aria-label="宣抬"></button>
      </div>
    </div>
    <div id="tubeA11y" class="sr-only" aria-live="polite" data-raw></div>
  </div>
  <header>
    <div class="who">
      <span id="roundTag"></span>
      <div class="seal" id="seal"></div>
      <div class="name" id="oppName"></div>
      <span class="brain hidden" id="brainDot"></span>
      <button id="menuBtn" aria-label="菜单">☰</button>
    </div>
    <div id="duoOpp">
      <div class="dicerow mirror" id="oppDice"></div>
      <div class="meta-line"><span class="chips" id="oppChips"></span></div>
    </div>
    <div id="trioOpp" class="hidden"></div>
    <div class="bubble hidden" id="bubble"></div>
  </header>

  <main>
    <div id="pot"></div>
    <div id="potChips"></div>
    <div id="bidBig"></div>
    <div id="hint"></div>
    <div id="modRow"></div>
    <div id="declareRow">
      <button class="stamp" id="blindBtn">盲</button>
      <button class="stamp" id="zhaiBtn">斋</button>
      <button class="stamp" id="raiseBtn">抬</button>
    </div>
  </main>

  <footer>
    <div class="meta-line"><span class="chips" id="myChips"></span></div>
    <div class="dicerow mirror" id="myDice"></div>
    <div id="pickRow">
      <div class="stepper">
        <button id="cntDown">−</button>
        <span class="val" id="cntVal">2</span>
        <button id="cntUp">＋</button>
      </div>
      <div id="facePick"></div>
    </div>
    <div id="actionRow">
      <button class="primary" id="bidBtn">报</button>
      <button class="danger" id="openBtn">开</button>
    </div>
  </footer>

  <div id="overlay" class="hidden"></div>
  <div id="drawer" class="hidden"></div>
  <div id="lobby" class="hidden"></div>
</div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
