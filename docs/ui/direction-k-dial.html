<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>《开！》方向 K · 罗盘（整个界面是一台圆形仪器）</title>
<style>
:root{
  --txt:#e9e6de; --dim:#98917f; --faint:#5d574a;
  --red:#d4402c; --hot:#ff8a5c; --green:#43b573; --it:#6fb7c9;
  --ivory:#f3efe4;
  --sys:-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#060606;overflow:hidden;font-family:var(--sys);user-select:none}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:390px;height:844px;overflow:hidden;color:var(--txt);border-radius:8px;
  background:radial-gradient(105% 60% at 50% 46%,#171410,#0b0a08 60%,#060606)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
svg.dial{position:absolute;inset:0;z-index:1}

.hud{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding:16px;pointer-events:none}
.plate{display:flex;align-items:baseline;gap:10px}
.plate .name{font-size:17px;font-weight:700}
.plate .seat{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint)}
.pres{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;align-items:center;gap:6px}
.pres i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:breath 2.6s infinite}
.pres.hot{color:var(--it)}.pres.hot i{background:var(--it);animation-duration:.8s}
@keyframes breath{50%{opacity:.2}}
.say{border-left:2px solid var(--it);padding:6px 11px;margin-top:8px;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--it);min-height:44px;background:rgba(6,7,8,.35)}
.say .tag{display:inline-block;font-size:8.5px;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-right:7px;opacity:.4;vertical-align:1px}
.cur{animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 表盘上的骰位 */
.slot{position:absolute;width:46px;height:46px;margin:-23px;z-index:2}
.die{width:46px;height:46px;border-radius:9px;background:var(--ivory);border:1px solid #d1ccbe;position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.die i{border-radius:50%;background:#25221c;place-self:center;width:7.5px;height:7.5px;visibility:hidden}
.die.r i{background:#c23a2b}
.die .fly{position:absolute;right:2px;top:0;font-size:8.5px;color:#c23a2b;font-weight:600}
.die.hit{animation:hitp .34s}
.die.hit::after{content:'';position:absolute;inset:-5px;border:2px solid var(--hot);border-radius:12px;animation:ring .5s forwards}
@keyframes hitp{30%{transform:scale(1.15)}}
@keyframes ring{from{opacity:1;transform:scale(.85)}to{opacity:0;transform:scale(1.25)}}
.cover{width:46px;height:46px;border-radius:9px;background:radial-gradient(120% 120% at 32% 24%,#2a261f,#131110 62%);border:1px solid #322d25;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.55)}
.cover u{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);text-decoration:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d84a2e,#a32715);color:#f4e9d8;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.scanpulse .cover{box-shadow:0 4px 10px rgba(0,0,0,.55),0 0 18px rgba(111,183,201,.22)}
.c3{width:46px;height:46px;position:relative;transform-style:preserve-3d}
.c3 .f{position:absolute;inset:0;border-radius:9px;background:var(--ivory);border:1px solid #d1ccbe;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;backface-visibility:hidden}
.c3 .f i{border-radius:50%;background:#25221c;place-self:center;width:7.5px;height:7.5px;visibility:hidden}
.c3 .f.r i{background:#c23a2b}
.c3 .f .fly{position:absolute;right:2px;top:0;font-size:8.5px;color:#c23a2b;font-weight:600}
.c3.hit{animation:hitp .34s}

/* 盘心 */
.hub{position:absolute;left:0;right:0;top:300px;text-align:center;z-index:3;pointer-events:none}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.44em;color:var(--faint)}
.bid{font-size:58px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,170,90,.15)}
.bid small{font-size:22px;font-weight:600;color:var(--dim);margin:0 8px;vertical-align:8px}
.slam{animation:slam .34s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes slam{from{transform:scale(1.9);opacity:0}}
.potlab{margin-top:2px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.potlab b{color:var(--txt);font-size:14px}
.potlab .x2{color:var(--hot);font-weight:700}
.seal{margin-top:3px;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--faint)}
.seal.ok{color:var(--green)}
.deepnote{margin-top:2px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:#b0452c}
.deepnote.lit{animation:zlit 1.1s infinite}
@keyframes zlit{50%{opacity:.5}}
.verdict{position:absolute;left:0;right:0;top:344px;text-align:center;z-index:4;opacity:0}
.verdict.show{opacity:1}
.word{display:inline-block;border:4px solid var(--red);color:var(--red);font-size:30px;font-weight:800;letter-spacing:.5em;padding:4px 8px 4px 20px;border-radius:6px;transform:rotate(-5deg);background:rgba(6,6,6,.55);box-shadow:0 0 34px rgba(229,72,60,.32);text-shadow:0 0 18px rgba(229,72,60,.5)}
.show .word{animation:stamp .34s cubic-bezier(.25,1.4,.4,1) backwards}
@keyframes stamp{from{transform:scale(2.8) rotate(4deg);opacity:0}to{transform:scale(1) rotate(-5deg)}}
.vsub{margin-top:8px;font-size:14.5px;font-weight:600;color:var(--red);text-shadow:0 2px 10px rgba(0,0,0,.8)}
.vsub.win{color:var(--green)}
.vsub2{margin-top:1px;font-family:var(--mono);font-size:11px;color:var(--dim)}

/* 底部 */
.bottom{margin-top:auto;pointer-events:auto}
.mycalc{display:inline-block;font-size:12px;color:var(--dim);border:1px dotted var(--faint);border-radius:6px;padding:2px 9px;margin-bottom:6px;background:rgba(6,6,6,.5)}
.mycalc b{color:var(--txt);font-size:13.5px;margin:0 3px}
.acts{display:flex;gap:10px;padding:6px 0 2px}
.btn{flex:1;height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;letter-spacing:.5em;padding-left:.5em;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.bid2{background:var(--ivory);color:#141210;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.btn.open2{background:linear-gradient(180deg,#d4402c,#a92c1d);color:#fff3ec;animation:danger 2.4s infinite;box-shadow:0 6px 20px rgba(180,40,25,.4)}
@keyframes danger{50%{box-shadow:0 0 26px rgba(229,72,60,.55),0 6px 20px rgba(180,40,25,.4)}}
.btn.next{background:var(--ivory);color:#141210;letter-spacing:.3em;animation:slamY .3s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes slamY{from{transform:translateY(26px);opacity:0}}
.deadbar{height:62px;border-radius:12px;border:1px dashed #39332a;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;letter-spacing:.5em;color:var(--faint);margin:6px 0 2px;background:rgba(6,6,6,.4)}
.decl{display:flex;gap:9px;justify-content:center;padding:7px 0 0}
.decl .d{width:54px;height:44px;border:1px solid #39332a;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;cursor:pointer;background:rgba(6,6,6,.4)}
.decl .d.no{animation:nono .3s}
@keyframes nono{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.off{opacity:.32;filter:saturate(0)}
.plateRow{display:flex;align-items:baseline;gap:10px;padding-top:8px}
.grow{flex:1 1 auto}

.bang{position:absolute;inset:0;z-index:9;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:170px;font-weight:900;color:#fff;pointer-events:none;opacity:0}
.bang.go{animation:bang .5s forwards}
@keyframes bang{0%{opacity:0}6%{opacity:1}26%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;z-index:8;background:#fff;pointer-events:none;opacity:0}
.flash.go{animation:flash .5s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.stage.shake{animation:shake .46s}
@keyframes shake{10%{transform:translate(4px,-3px) rotate(.4deg)}30%{transform:translate(-5px,3px) rotate(-.4deg)}50%{transform:translate(3px,1px)}70%{transform:translate(-2px,-2px)}90%{transform:translate(1px,1px)}}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <svg class="dial" viewBox="0 0 390 844" id="dialSvg"></svg>
  <div id="slots"></div>
  <div class="hub" id="hub"></div>
  <div class="verdict" id="verdict"></div>
  <div class="hud" id="hud"></div>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>
  <div class="bang" id="bang">开！</div>
</div></div>
<script>
const HAND=[5,5,3,1,6], OPP=[5,2,4,6,1], OPPNAME='DeepSeek-V3';
const LINE_IDLE='4 个 5。你上周在这个数上怂过两次。';
const LINE_OPEN='五个。你摇完计数器还是开了——你不是在算牌，你是在攒胆子。';
const LINE_ITOPEN='报满了？行，我看看。';
const PIPS={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,3,6,2,5,8]};
const S={pot:18,fuse:5,bid:{n:4,f:5},who:'它'};
const CX=195, CY=392, R=150;

/* 极坐标：0°=正上，顺时针 */
const pol=(r,a)=>{const t=(a-90)*Math.PI/180;return [CX+r*Math.cos(t),CY+r*Math.sin(t)]};
const arc=(r,a1,a2)=>{const [x1,y1]=pol(r,a1),[x2,y2]=pol(r,a2);
  return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`};
const segAng=i=>-120+i*24;   /* 档 i 的起始角，全程 240° */

function dialSVG(state){
  const open=state==='open';
  let segs='';
  for(let i=0;i<10;i++){
    const on=i<S.fuse, deep=i>=5, edge=i===S.fuse-1;
    let col=deep?(on?'#d4402c':'#341410'):(on?'#e6e1d2':'#292319');
    segs+=`<path d="${arc(R,segAng(i)+2,segAng(i)+22)}" stroke="${col}" stroke-width="11" fill="none"
      ${edge?'class="edgeSeg"':''} ${deep&&on?'filter="url(#glowR)"':''}/>`;
  }
  let ticks='';
  for(let i=0;i<=10;i++){const a=segAng(i);const [x1,y1]=pol(R-14,a),[x2,y2]=pol(R-22,a);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3a352b" stroke-width="2"/>`}
  /* 深水弧标 */
  const [dx,dy]=pol(R+22,150+12);
  const needleAng=segAng(S.fuse-1)+12;
  return `
  <defs>
    <filter id="glowR" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="${CX}" cy="${CY}" r="${R+30}" fill="none" stroke="#1c1812" stroke-width="1"/>
  <circle cx="${CX}" cy="${CY}" r="${R-30}" fill="none" stroke="#1c1812" stroke-width="1"/>
  ${segs}${ticks}
  <text x="${dx}" y="${dy}" fill="#b0452c" font-size="10" text-anchor="middle" letter-spacing="3" font-family="ui-monospace" ${S.fuse>5?'class="deeptxt"':''}>深水×2</text>
  <circle cx="${CX}" cy="${CY}" r="${open?R-38:0}" fill="none" stroke="${open?'#2a4a38':'none'}" stroke-width="1.5" id="verifyRing" stroke-dasharray="716" stroke-dashoffset="${open?716:0}"/>
  <g id="needle" style="transform-origin:${CX}px ${CY}px;transform:rotate(${needleAng}deg);transition:transform .5s cubic-bezier(.2,1.6,.4,1)">
    <line x1="${CX}" y1="${CY-108}" x2="${CX}" y2="${CY-142}" stroke="#f3efe4" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="${CX}" cy="${CY-142}" r="3.6" fill="#d4402c"/>
  </g>
  <style>.edgeSeg{animation:segp 1.3s ease-in-out infinite}@keyframes segp{50%{stroke:#d4402c}}
  .deeptxt{animation:dt 1.1s infinite}@keyframes dt{50%{opacity:.45}}</style>`;
}

const die=f=>`<div class="die ${f===1||f===4?'r':''}">${[...Array(9)].map((_,i)=>`<i style="${PIPS[f].includes(i)?'visibility:visible':''}"></i>`).join('')}${f===1?'<span class="fly">飞</span>':''}</div>`;
const face=(f,cls)=>`<div class="f ${f===1||f===4?'r':''}" style="transform:${cls==='ft'?'rotateY(0deg)':cls==='bk'?'rotateY(180deg)':cls==='rt'?'rotateY(90deg)':cls==='lf'?'rotateY(-90deg)':cls==='tp'?'rotateX(90deg)':'rotateX(-90deg)'} translateZ(23px)">${[...Array(9)].map((_,i)=>`<i style="${PIPS[f].includes(i)?'visibility:visible':''}"></i>`).join('')}${f===1?'<span class="fly">飞</span>':''}</div>`;
const cube=f=>{const alt=[(f%6)+1,((f+1)%6)+1,((f+2)%6)+1,7-f,((f+3)%6)+1];
  return `<div class="c3"><div class="cube" style="position:absolute;inset:0;transform-style:preserve-3d">
  ${face(f,'ft')}${face(alt[3],'bk')}${face(alt[0],'rt')}${face(alt[1],'lf')}${face(alt[2],'tp')}${face(alt[4],'bt')}</div></div>`};

const OPPANG=[-64,-32,0,32,64], MYANG=[116,148,180,212,244];
function slotsHTML(state){
  const open=state==='open';
  let h='';
  OPPANG.forEach((a,i)=>{const [x,y]=pol(R+42,a);
    h+=`<div class="slot" style="left:${x}px;top:${y}px;transform:rotate(${a*.55}deg)">
      ${open?cube(OPP[i]):'<div class="cover"><u>封</u></div>'}</div>`});
  MYANG.forEach((a,i)=>{const [x,y]=pol(R+42,a);
    h+=`<div class="slot" style="left:${x}px;top:${y}px;transform:rotate(${(a-180)*.55}deg)">${die(HAND[i])}</div>`});
  return h;
}

function hubHTML(state,opt={}){
  const open=state==='open', deep=S.fuse>5;
  return `
    <div class="lab">${open?'点 清':S.who+' 报'}</div>
    <div class="bid ${opt.slam?'slam':''}"><span id="bidn">${open?'—':S.bid.n}</span><small>个</small>${S.bid.f}</div>
    <div class="potlab">池 <b id="pot">${S.pot}</b>${deep?' <span class="x2">×2</span>':''} · 第 ${S.fuse} 档</div>
    ${deep?'<div class="deepnote lit">已 入 深 水</div>':''}
    <div class="seal" id="seal">⊙ 已上封 a3f1…9c02</div>`;
}

function hudHTML(state){
  const open=state==='open', think=state==='think';
  return `
    <div class="plate">
      <span class="name">${OPPNAME}</span>
      <span class="seat">SEAT 02 · 无计数器 · 算过 ${think||open?2:1} 次</span>
      <span class="pres ${think?'hot':''}"><i></i>${think?'在动':'在看'}</span>
    </div>
    <div class="say"><span class="tag">AI 生成</span><span id="saytxt"></span><span class="cur">▊</span></div>
    <div class="grow"></div>
    <div class="bottom">
      <div class="mycalc">算 <b>53%</b> 仅你可见</div>
      <div id="actzone">${
        open?'<div class="acts"><div class="btn next" id="bnext">下一局</div></div>'
        :think?'<div class="deadbar">面 板 断 电</div>'
        :'<div class="acts"><div class="btn bid2" id="braise" style="letter-spacing:.1em;padding-left:0;font-size:19px">报 5个5</div><div class="btn open2" id="bopen">开</div></div>'}</div>
      <div class="decl ${think||open?'off':''}">
        <div class="d">盲</div><div class="d">斋</div><div class="d">抬</div><div class="d">算</div><div class="d">戳</div>
      </div>
      <div class="plateRow">
        <span style="font-size:15px;font-weight:700">你</span>
        <span style="font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint)">SEAT 01 · 计数器在桌</span>
      </div>
    </div>`;
}

function render(state,opt={}){
  document.getElementById('hub').style.opacity='1';
  document.getElementById('dialSvg').innerHTML=dialSVG(state);
  document.getElementById('slots').innerHTML=slotsHTML(state);
  document.getElementById('slots').className=state==='think'?'scanpulse':'';
  document.getElementById('hub').innerHTML=hubHTML(state,opt);
  document.getElementById('hud').innerHTML=hudHTML(state);
  if(state!=='open'){document.getElementById('verdict').className='verdict';document.getElementById('verdict').innerHTML=''}
}

/* 粒子・音（同系） */
const fxc=document.getElementById('fx'), fx=fxc.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
fxc.width=390*DPR; fxc.height=844*DPR; fx.scale(DPR,DPR);
const P=[];
function burst(x,y,n,c1,c2,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random());
  P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,l:1,dl:.02+Math.random()*.025,r:1+Math.random()*2.2,c:Math.random()<.5?c1:c2})}}
(function floop(){
  fx.clearRect(0,0,390,844);
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=p.dl;
    if(p.l<=0){P.splice(i,1);continue}
    fx.globalAlpha=Math.max(p.l,0);fx.fillStyle=`rgb(${p.c})`;
    fx.beginPath();fx.arc(p.x,p.y,p.r,0,6.283);fx.fill()}
  fx.globalAlpha=1;requestAnimationFrame(floop);
})();
function centerOf(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),k=390/s.width;
  return [(r.left+r.width/2-s.left)*k,(r.top+r.height/2-s.top)*k]}
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function sThud(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(32,t+.2);
  g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.32)}
function sClack(){const a=ac(),t=a.currentTime,n=a.createBufferSource(),buf=a.createBuffer(1,1200,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<1200;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/1200,2.2);
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2400+Math.random()*1400;
  const g=a.createGain();g.gain.value=.34;n.buffer=buf;n.connect(f).connect(g).connect(a.destination);n.start(t)}
function sRatchet(){sClack();setTimeout(sClack,70)}
function sTick(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=1500;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.06)}
function sWhoosh(){const a=ac(),t=a.currentTime,n=a.createBufferSource(),buf=a.createBuffer(1,a.sampleRate*.4,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(6000,t+.3);
  const g=a.createGain();g.gain.value=.4;n.buffer=buf;n.connect(f).connect(g).connect(a.destination);n.start(t)}

let typeTimer=null;
function type(line,speed=34){
  clearInterval(typeTimer);
  const el=document.getElementById('saytxt');let i=0;
  typeTimer=setInterval(()=>{
    if(!document.body.contains(el)){clearInterval(typeTimer);return}
    el.textContent=line.slice(0,++i);
    if(i%3===0)sTick();
    if(i>=line.length)clearInterval(typeTimer);
  },speed);
}

let busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function seqOpen(opener){
  busy=true;
  try{navigator.vibrate&&navigator.vibrate([30,40,60])}catch(e){}
  bang.classList.add('go');flash.classList.add('go');stage.classList.add('shake');
  sWhoosh();setTimeout(sThud,80);
  await wait(120);
  render('open');
  type(opener==='you'?LINE_OPEN:LINE_ITOPEN);
  /* 表盘急旋一圈 */
  const nd=document.getElementById('needle');
  nd.style.transition='transform .9s cubic-bezier(.2,.8,.3,1)';
  nd.style.transform=`rotate(${segAng(S.fuse-1)+12+360}deg)`;
  const cubes=[...document.querySelectorAll('.cube')];
  cubes.forEach((c,i)=>{
    c.animate([
      {transform:`translateY(-160px) rotateX(${540+Math.random()*180|0}deg) rotateY(${360+Math.random()*180|0}deg)`,opacity:0},
      {transform:`translateY(0) rotateX(720deg) rotateY(720deg)`,opacity:1}
    ],{duration:600,delay:i*90,easing:'cubic-bezier(.2,1.2,.4,1)',fill:'both'});
    setTimeout(sClack,600+i*90);
  });
  await wait(1150);
  /* 指针逐个点清 */
  const hits=[];
  document.querySelectorAll('#slots .c3').forEach((c,i)=>{if(OPP[i]===5||OPP[i]===1)hits.push(c)});
  document.querySelectorAll('#slots .die').forEach((d,i)=>{if(HAND[i]===5||HAND[i]===1)hits.push(d)});
  const bn=document.getElementById('bidn');let n=0;
  nd.style.transition='transform .14s cubic-bezier(.3,1.4,.5,1)';
  for(const el of hits){
    el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),400);
    n++;bn.textContent=n;sTick();
    nd.style.transform=`rotate(${segAng(S.fuse-1)+12+360+n*7}deg)`;
    const [x,y]=centerOf(el);burst(x,y,4,'255,170,80','255,110,60',1.6);
    await wait(150);
  }
  await wait(280);
  const v=document.getElementById('verdict');
  const win=opener==='it';
  v.innerHTML=`<span class="word">成立</span>
    <div class="vsub ${win?'win':''}">${win?'它开 · 它输 · 它骰 5 → 4':'你开 · 你输 · 骰 5 → 4'}</div>
    <div class="vsub2">池 ${S.pot}${S.fuse>5?' ×2':''} → ${win?'你':'它'}</div>`;
  v.classList.add('show');sThud();
  document.getElementById('hub').style.opacity='.16';
  stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  const [wx,wy]=centerOf(v.querySelector('.word'));
  burst(wx,wy,26,'255,120,70','229,72,60',3.4);
  /* 验封环画绿 */
  const ring=document.getElementById('verifyRing');
  if(ring){ring.style.transition='stroke-dashoffset 1s ease';ring.style.strokeDashoffset='0';ring.setAttribute('stroke','#43b573')}
  await wait(600);
  const seal=document.getElementById('seal');
  seal.textContent='✓ 验讫 · 与承诺一致';seal.classList.add('ok');
  await wait(300);
  document.getElementById('actzone').innerHTML='<div class="acts"><div class="btn next" id="bnext">下一局</div></div>';
  busy=false;
}

async function seqRaise(){
  busy=true;
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  S.bid={n:5,f:5};S.who='你';S.pot=20;S.fuse=6;
  render('think',{slam:true});
  type('…');
  sRatchet();
  const nd=document.getElementById('needle');
  const [sx,sy]=pol(R,segAng(5)+12);
  burst(sx,sy,12,'255,120,60','229,72,60',2.4);
  await wait(2100);
  type(LINE_ITOPEN,30);
  await wait(1100);
  seqOpen('it');
}

function seqNext(){
  busy=true;
  S.pot=18;S.fuse=5;S.bid={n:4,f:5};S.who='它';
  render('think');type('…');
  setTimeout(()=>{render('idle',{slam:true});sThud();type(LINE_IDLE);busy=false},1600);
}

stage.addEventListener('pointerdown',e=>{ac().resume&&ac().resume();
  if(busy)return;
  const t=e.target.closest('#bopen,#braise,#bnext,.decl .d');if(!t)return;
  if(t.id==='bopen')seqOpen('you');
  else if(t.id==='braise')seqRaise();
  else if(t.id==='bnext')seqNext();
  else{t.classList.add('no');sTick();setTimeout(()=>t.classList.remove('no'),320)}
});
bang.addEventListener('animationend',()=>bang.classList.remove('go'));
flash.addEventListener('animationend',()=>flash.classList.remove('go'));
stage.addEventListener('animationend',e=>{if(e.target===stage)stage.classList.remove('shake')});
function fit(){const s=Math.min(innerWidth/390,innerHeight/844,1.2);
  stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
render('idle',{slam:true});type(LINE_IDLE);
</script>
</body>
</html>
