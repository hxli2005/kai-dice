<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>《开！》方向 O · 三管机（单色荧光 × 余辉 × 对称三管）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100dvh;overflow:hidden;overscroll-behavior:none;background:#000}
body{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
</style>
</head>
<body>
<div class="viewport"><canvas id="game"></canvas></div>
<script>
/* ══════════ 《开！》方向 O · 三管机 ══════════
   铁律：光的世界单色荧光，物的世界才有颜色。
   三只同尺寸显像管垂直对称：绿磷管(它)/白磷管(裁判)/琥珀磷管(你)。
   每管自带余辉缓冲（磷光拖尾）；「它」=一道示波心跳；判定=反白视频条＋
   机壳红LED；阶梯=机壳实体LED灯条；数据包沿蚀刻电路走线爬行。 */
const W=195,H=422,SS=4;
const glc=document.getElementById('game');
glc.width=W*SS;glc.height=H*SS;
const off=document.createElement('canvas');off.width=W;off.height=H;
let ctx=off.getContext('2d');                    /* 可切换到管内余辉面 */
const MAIN=ctx;
function fit(){const s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));
  glc.style.width=W*s+'px';glc.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

const HAND=[5,5,3,1,6],OPP=[5,2,4,6,1],OPPNAME='DeepSeek-V3';
const LINE_IDLE='4个5。你上周在这个数上怂过两次。';
const LINE_OPEN='五个。你摇完计数器还是开了——你在攒胆子。';
const LINE_ITOPEN='报满了？行，我看看。';
const PIPS={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,3,6,2,5,8]};
const GLY='0123456789ABCDEF◢◣▲▌░▒▓ｱｶｻﾀﾅﾊﾏﾔ';

/* 磷光谱系：每管一族，别无他色 */
const PH={
  a:{glass:'#020b06',fadeC:'2,11,6',lo:'#0c3a22',mid:'#37d987',hot:'#c8ffdf'},
  b:{glass:'#07090c',fadeC:'7,9,12', lo:'#2a3540',mid:'#c8dbe6',hot:'#ffffff'},
  c:{glass:'#100a02',fadeC:'16,10,2',lo:'#4a3210',mid:'#ffb84d',hot:'#ffedc9'}};
const CH={chas:'#101216',rail:'#1a1d24',led:'#ffb84d',ledR:'#ff3b30',key:'#dfe4e0',keyR:'#b3271e'};

const TUBE={
  a:{x:4,y:4,  w:187,h:108},
  b:{x:4,y:120,w:187,h:108},
  c:{x:4,y:248,w:187,h:108}};
for(const k in TUBE){const T=TUBE[k];T.pc=document.createElement('canvas');
  T.pc.width=T.w;T.pc.height=T.h;T.pctx=T.pc.getContext('2d');
  T.pctx.fillStyle=PH[k].glass;T.pctx.fillRect(0,0,T.w,T.h)}
const LEDBAR={x:8,y:233,w:178,h:8};
const KEYS_Y=364;
const blockLX=i=>27+i*30, dieLX=i=>10+i*36;      /* 管内局部坐标 */

/* ── 时钟/补间 ── */
let now=0,timeScale=1,FR=1,last=performance.now();
const tweens=[],later=[];
function tw(o){o.t0=now+(o.delay||0);o.dur=o.dur*(0.9+Math.random()*0.2);
  if(o.id)for(let i=tweens.length-1;i>=0;i--)if(tweens[i].id===o.id)tweens.splice(i,1); /* 同键去重防互踩 */
  tweens.push(o)}
function at(ms,fn){later.push({t:now+ms,fn})}
const easeOver=p=>1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2), easeOut=p=>1-Math.pow(1-p,3);
function stepClock(dt){now+=dt*timeScale;
  for(let i=later.length-1;i>=0;i--)if(now>=later[i].t){const f=later[i].fn;later.splice(i,1);f()}
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];if(now<t.t0)continue;
    const p=Math.min(1,(now-t.t0)/t.dur);t.apply((t.ease||easeOut)(p));
    if(p>=1){tweens.splice(i,1);t.done&&t.done()}}}

const S={pot:18,fuse:5,bid:{n:4,f:5},who:'它',phase:'boot'};
const V={bidScale:1,bidText:null,potShow:18,potPop:0,mid:1,actIn:1,power:0,
  say:{full:'',n:0,timer:0},shX:0,shY:0,flash:0,glitch:0,
  blocks:OPP.map(f=>({state:'enc',face:f,gly:'A',cyc:0,flip:0})),
  dice:HAND.map(()=>({hit:0})),verdict:null,seal:'⊙ 双方骰面已上封 · 摊牌验',sealC:null,
  press:null,deny:null,parX:0,parY:0,ripples:[],parts:[],packs:[],floats:[],
  tparts:{a:[],b:[],c:[]},
  warm:{a:0,b:0,c:0,ctl:0},flick:{},judLED:0};
const WAVE={amp:5,voice:0,flat:0,chaos:0,ph:0};

/* ── 音（8-bit＋变调＋挂起门控） ── */
let AC=null,HUMG=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator();HUMG=AC.createGain();o.type='triangle';o.frequency.value=52;
  HUMG.gain.value=.012;o.connect(HUMG).connect(AC.destination);o.start()}return AC}
const dtn=()=>1+(Math.random()-.5)*.1;
function blip(f,dur=.06,type='square',vol=.1){const a=ac();if(a.state!=='running')return; /* §6.1 不积压 */
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f*dtn();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function sweep(f0,f1,dur,vol=.12){const a=ac();if(a.state!=='running')return;
  const k=dtn();f0*=k;f1*=k;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur+.05);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.08)}
function sDrop(){const a=ac();if(a.state!=='running')return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  if(HUMG)HUMG.gain.setValueAtTime(.001,t),HUMG.gain.linearRampToValueAtTime(.012,t+.8);
  o.type='sine';o.frequency.setValueAtTime(118*dtn(),t);o.frequency.exponentialRampToValueAtTime(34,t+.42); /* §6.2 80–150Hz 起锤 */
  g.gain.setValueAtTime(.75,t);g.gain.exponentialRampToValueAtTime(.001,t+.55);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.6);
  const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*.25,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=320;
  const g2=a.createGain();g2.gain.value=.4;n.buffer=b;n.connect(f).connect(g2).connect(a.destination);n.start(t)}
function sClack(){const a=ac();if(a.state!=='running')return;
  const t=a.currentTime,n=a.createBufferSource(),b=a.createBuffer(1,900,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<900;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/900,2.4);
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2200+Math.random()*900;
  const g=a.createGain();g.gain.value=.3;n.buffer=b;n.connect(f).connect(g).connect(a.destination);n.start(t)}
const sTick=i=>blip(720+i*110+S.fuse*55,.05,'square',.09);
const sDeny=()=>blip(150,.09,'sawtooth',.12);
const sType=()=>{if(AC&&AC.state==='running')blip(1500,.02,'square',.03)};

/* ── 输入 ── */
const BTN={};
function press(id){V.press={id,t:now};blip(430,.05,'square',.08);try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function scrEl(){return off.parentNode?off:glc}
function toGame(e){const r=scrEl().getBoundingClientRect();
  let nx=((e.clientX-r.left)/r.width)*2-1,ny=((e.clientY-r.top)/r.height)*2-1;
  if(!off.parentNode){const k=1+.030*(nx*nx+ny*ny);nx*=k;ny*=k}
  return [(nx*.5+.5)*W,(ny*.5+.5)*H]}
document.addEventListener('pointerdown',e=>{
  ac().resume&&ac().resume();
  const [x,y]=toGame(e);
  if(S.phase==='boot'){V.power=1;bootDone();return}
  if(S.phase==='seq'||S.phase==='think'){timeScale=3.2;return}   /* think 也可快进 [§3.6] */
  let hit=null;
  for(const id in BTN){const b=BTN[id];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){hit=id;break}}
  if(hit==='open'&&S.phase==='idle'){press('open');S.phase='seq';at(90,()=>seqOpen('you'))}
  else if(hit==='raise'&&S.phase==='idle'){press('raise');S.phase='seq';at(90,()=>seqRaise())}
  else if(hit==='next'&&S.phase==='settle'){press('next');S.phase='seq';at(90,()=>seqNext())}
  else if(hit&&hit.startsWith('decl')){V.deny={id:hit,t:now,msg:'样机未接线'};sDeny();
    try{navigator.vibrate&&navigator.vibrate(24)}catch(e){}}
  else V.ripples.push({x,y,t:now});
});
document.addEventListener('pointermove',e=>{const r=scrEl().getBoundingClientRect();
  V.parX=((e.clientX-r.left)/r.width-.5)*2;V.parY=((e.clientY-r.top)/r.height-.5)*2});
document.addEventListener('pointerup',()=>{V.press=null});

function say(line){V.say={full:line,n:0,timer:0}}
function burst(x,y,n,cols,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random());
  V.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.8,l:1,dl:.018+Math.random()*.02,s:1+(Math.random()<.3?1:0),c:cols[Math.random()*cols.length|0]})}}
/* 管内粒子：进余辉面（拖磷光尾、吃扫描线、被玻璃裁切）——铁律：光不出管 */
function burstT(k,x,y,n,cols,sp){const L=V.tparts[k];
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random());
    L.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.8,l:1,dl:.018+Math.random()*.02,s:1+(Math.random()<.3?1:0),c:cols[Math.random()*cols.length|0]})}}
function stepTParts(k){const L=V.tparts[k];
  for(let i=L.length-1;i>=0;i--){const p=L[i];
    p.x+=p.vx*FR;p.y+=p.vy*FR;p.vy+=.045*FR;p.l-=p.dl*FR;
    if(p.l<=0){L.splice(i,1);continue}
    ctx.globalAlpha=Math.max(0,p.l)*AMUL;ctx.fillStyle=p.c;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}
  ctx.globalAlpha=AMUL}
function shake(m){tw({dur:360,apply:p=>{const k=m*(1-p);
  V.shX=Math.round((Math.random()-.5)*k);V.shY=Math.round((Math.random()-.5)*k)},done:()=>{V.shX=0;V.shY=0}})}
function hitStop(){const prev=timeScale>0?timeScale:1;timeScale=0;
  setTimeout(()=>{if(timeScale===0)timeScale=prev},85)}
/* 电路走线上的数据包：沿折线爬行 */
const TRACES={
  up:[[30,112],[30,116],[97,116],[97,120]],           /* A→B */
  dn:[[164,248],[164,242],[97,242],[97,228]],         /* C→B（沿LED条侧） */
  key:[[52,364],[52,360],[97,360],[97,356]]};         /* 键区→C */
function pack(trace,c,rev,done){V.packs.push({tr:TRACES[trace],c,rev:!!rev,t:now,dur:380+Math.random()*80,done})}

/* ── 序列 ── */
let GEN=0;                                            /* 代际门控：换局后旧演出回调作废 */
function seqOpen(opener){
  const g=++GEN;
  S.phase='seq';WAVE.chaos=1;tw({dur:900,apply:p=>{WAVE.chaos=1-p}});
  at(240,()=>{
    try{navigator.vibrate&&navigator.vibrate([30,40,60])}catch(e){}
    V.flash=1;V.glitch=1;shake(7);sDrop();sweep(2400,180,.3,.15);
    tw({dur:340,apply:p=>{V.flash=1-p}});
    tw({dur:620,apply:p=>{V.glitch=(1-p)*.8}});
    V.bidText='—';V.verdict=null;
    say(opener==='you'?LINE_OPEN:LINE_ITOPEN);
    V.blocks.forEach((b,i)=>{
      at(240+i*160,()=>{b.state='dec';b.flip=0;
        tw({dur:420,apply:p=>{b.flip=p},done:()=>{b.state='die';sClack();
          burstT('a',blockLX(i)+11,69,6,[PH.a.mid,PH.a.hot],1.6)}})})});
    const hits=[];
    OPP.forEach((f,i)=>{if(f===5||f===1)hits.push(['b',i])});
    HAND.forEach((f,i)=>{if(f===5||f===1)hits.push(['d',i])});
    let n=0;
    hits.forEach((h,k)=>{
      at(1280+k*150,()=>{n++;V.bidText=''+n;sTick(n);
        if(h[0]==='b'){V.blocks[h[1]].hit=now;burstT('a',blockLX(h[1])+11,69,4,[PH.a.hot],1.4)}
        else{V.dice[h[1]].hit=now;burstT('c',dieLX(h[1])+15,45,4,[PH.c.hot],1.4)}})});
    const win=opener==='it';
    at(1280+hits.length*150+120,()=>{tw({dur:170,apply:p=>{V.mid=1-p}})});
    at(1280+hits.length*150+250,()=>{
      V.verdict={win,a:1,blink:0,
        sub:win?'它开·它输·它骰 5→4':'你开·你输·骰 5→4',
        sub2:`池 ${S.pot}${S.fuse>5?'×2':''} → ${win?'你':'它'}`};
      WAVE.flat=1;V.judLED=1;                         /* 心跳停了；判定灯亮 */
      sDrop();shake(5);hitStop();
      try{navigator.vibrate&&navigator.vibrate(70)}catch(e){}
      burstT('b',TUBE.b.w/2,58,26,[PH.b.hot,PH.b.mid],2.4);
      /* 结算＝筹码流：一枚枚搬走，池滚降，落地炸花，末枚落定砸出大号±N */
      const tot=S.pot*(S.fuse>5?2:1);
      const chips=Math.max(6,Math.min(10,Math.round(S.pot/2)));
      const dst=win?{k:'dn',tk:'c',lx:156,ly:8,pal:PH.c}:{k:'up',tk:'a',lx:26,ly:100,pal:PH.a};
      for(let i2=0;i2<chips;i2++){
        at(300+i2*85,()=>{if(g!==GEN)return;
          V.potShow=Math.max(0,V.potShow-S.pot/chips);
          sTick(i2%5+1);
          pack(dst.k,dst.pal.mid,true,()=>{burstT(dst.tk,dst.lx,dst.ly,7,[dst.pal.hot,dst.pal.mid],1.8)})});}
      at(300+chips*85+260,()=>{if(g!==GEN)return;
        V.floats.push({x:win?TUBE.c.x+TUBE.c.w/2:TUBE.a.x+TUBE.a.w/2,
          y:win?TUBE.c.y+26:TUBE.a.y+56,txt:'+'+tot,c:dst.pal.hot,t:now});
        burstT(dst.tk,win?TUBE.c.w/2:TUBE.a.w/2,win?30:58,18,[dst.pal.hot,dst.pal.mid],2.2);
        blip(150*dtn(),.2,'sine',.35);sClack();shake(3);
        try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}});
    });
    at(1280+hits.length*150+700,()=>{V.seal='✓ 验讫 · 骰面与开局承诺一致';V.sealC='ok';blip(1040,.09,'triangle',.09)});
    at(1280+hits.length*150+950,()=>{S.phase='settle';timeScale=1;
      V.actIn=0;tw({dur:240,ease:easeOver,apply:p=>{V.actIn=p}})});
  });
}
function seqRaise(){
  S.phase='seq';
  pack('key',PH.c.mid);at(120,()=>pack('key',PH.c.mid));
  blip(560,.07,'square',.1);
  at(320,()=>{
    S.bid={n:5,f:5};S.who='你';S.pot=20;
    V.bidText=null;
    V.bidScale=.4;tw({dur:300,ease:easeOver,apply:p=>{V.bidScale=.4+.6*p}});
    /* 双方各追一注 [D§1.2]：两枚注沿走线进白管，到账那一下才 +1 */
    const ante=()=>{V.potShow=Math.min(S.pot,Math.round(V.potShow)+1);
      V.potPop=1;tw({id:'potPop',dur:260,apply:p=>{V.potPop=1-p}});
      sClack();blip(820+Math.round(V.potShow)*30,.05,'square',.11);
      burstT('b',TUBE.b.w/2+2,72,12,[PH.b.hot,PH.c.mid,PH.a.mid],2.0);
      shake(2);try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};
    pack('up',PH.a.mid,false,ante);at(60,()=>pack('up',PH.a.lo));      /* 注是一小串，不是一粒 */
    at(150,()=>{pack('dn',PH.c.mid,false,ante);at(60,()=>pack('dn',PH.c.lo))});
    /* 阶梯进档：LED 重击点亮，坠入深水 */
    at(340,()=>{S.fuse=6;sClack();blip(170,.12,'square',.16);      /* 进档重击但不动判定专属低锤 [§6.2] */
      burst(LEDBAR.x+5*17.8+8,LEDBAR.y+4,12,[CH.ledR,'#ff8a5c'],2)});
    say('…');S.phase='think';
  });
  at(2400,()=>{say(LINE_ITOPEN)});
  at(3500,()=>{seqOpen('it')});
}
function seqNext(){
  GEN++;V.packs.length=0;V.floats.length=0;          /* 旧局余戏清场 */
  S.phase='seq';
  S.pot=18;S.fuse=5;S.bid={n:4,f:5};S.who='它';
  tw({dur:150,apply:p=>{if(V.verdict)V.verdict.a=1-p},done:()=>{V.verdict=null;
    V.seal='⊙ 双方骰面已上封 · 摊牌验';V.sealC=null;
    tw({dur:260,apply:p=>{V.mid=p}})}});
  V.judLED=0;
  tw({dur:700,delay:250,apply:p=>{WAVE.flat=1-p}});    /* 心跳复苏 */
  V.blocks.forEach((b,i)=>{at(120+i*70,()=>{b.state='dec';sClack();
    tw({dur:300,apply:p=>{b.flip=1-p},done:()=>{b.state='enc';b.flip=0}})})});
  tw({dur:500,delay:300,apply:p=>{V.potShow=18*p},done:()=>{V.potShow=18}});
  say('…');
  at(1300,()=>{V.bidText=null;V.bidScale=0;tw({dur:320,ease:easeOver,apply:p=>{V.bidScale=p}});
    V.actIn=0;tw({dur:240,ease:easeOver,apply:p=>{V.actIn=p}});
    blip(220,.1,'square',.12);say(LINE_IDLE);S.phase='idle'});   /* 开局不抢判定的锤 */
}
function bootDone(){if(S.phase!=='boot')return;S.phase='idle';
  ['a','b','c','ctl'].forEach((k,i)=>{
    at(i*160,()=>{tw({dur:420,apply:p=>{V.warm[k]=p}});blip(420+i*160,.08,'square',.08)})});
  V.bidScale=0;tw({dur:320,ease:easeOver,delay:700,apply:p=>{V.bidScale=p}});
  V.actIn=0;tw({dur:240,ease:easeOver,delay:800,apply:p=>{V.actIn=p}});
  sweep(180,880,.3,.1);at(800,()=>say(LINE_IDLE))}

/* ── 绘制 ── */
const R=Math.round;
let AMUL=1;
function tx(s,x,y,size,color,{bold=false,mono=false,align='left',alpha=1}={}){
  ctx.globalAlpha=alpha*AMUL;ctx.fillStyle=color;
  ctx.font=`${bold?'bold ':''}${size}px ${mono?'Menlo,monospace':'"PingFang SC",sans-serif'}`;
  ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(s,R(x),R(y));ctx.globalAlpha=AMUL}
function rr(c,x,y,w,h,r){c.beginPath();
  if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
/* 枕形玻璃口：四边中点向外鼓、大圆角——显像管的轮廓签名 */
function pillow(c,x,y,w,h,r,bow){
  c.beginPath();
  c.moveTo(x+r,y);
  c.quadraticCurveTo(x+w/2,y-bow,x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.quadraticCurveTo(x+w+bow,y+h/2,x+w,y+h-r);
  c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.quadraticCurveTo(x+w/2,y+h+bow,x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.quadraticCurveTo(x-bow,y+h/2,x,y+r);
  c.quadraticCurveTo(x,y,x+r,y);
  c.closePath()}

/* 单色荧光骰：描边＋发光点数（pal 决定它绿你琥珀） */
function drawDieP(x,y,s,f,pal,hit){

/* 它的心跳：示波扫线（余辉面上自然拖尾） */
function drawWave(pal){
  const y0=40,x0=10,x1=177;
  WAVE.ph+=(.09+WAVE.chaos*.3+(S.phase==='think'?.12:0))*FR;
  WAVE.voice*=Math.pow(.86,FR);
  const amp=(5+WAVE.voice*7+WAVE.chaos*12+(S.phase==='think'?3:0))*(1-WAVE.flat);
  ctx.strokeStyle=pal.hot;ctx.lineWidth=1;ctx.globalAlpha=.9*AMUL;
  ctx.beginPath();
  for(let x=x0;x<=x1;x+=2){
    const k=(x-x0)/(x1-x0);
    let y=Math.sin(k*9+WAVE.ph)*Math.sin(k*23-WAVE.ph*1.7)*amp;
    if(WAVE.chaos>0)y+=(Math.random()-.5)*WAVE.chaos*10;
    if(x===x0)ctx.moveTo(x,y0+y);else ctx.lineTo(x,y0+y)}
  ctx.stroke();ctx.globalAlpha=AMUL;
  ctx.fillStyle=pal.hot;ctx.fillRect(x1-1,y0-1+(WAVE.flat?0:Math.sin(WAVE.ph*2)*2),2,2)}

/* ═ 管子：厚框→坑→圆角玻璃；内容画进余辉面；管面收尾 ═ */
function tubeFrame(k){const T=TUBE[k];
  ctx.fillStyle=CH.rail;ctx.fillRect(T.x-4,T.y-4,T.w+8,T.h+8);
  ctx.globalAlpha=.22;ctx.fillStyle='#fff';ctx.fillRect(T.x-4,T.y-4,T.w+8,1);ctx.globalAlpha=1;
  ctx.globalAlpha=.10;ctx.fillStyle='#fff';ctx.fillRect(T.x-4,T.y-3,1,T.h+7);ctx.globalAlpha=1;
  ctx.globalAlpha=.5;ctx.fillStyle='#000';ctx.fillRect(T.x-4,T.y+T.h+3,T.w+8,1);ctx.globalAlpha=1;
  ctx.globalAlpha=.35;ctx.fillStyle='#000';ctx.fillRect(T.x+T.w+3,T.y-3,1,T.h+7);ctx.globalAlpha=1;
  ctx.fillStyle='#0b0d11';ctx.fillRect(T.x-2,T.y-2,T.w+4,T.h+4);
  /* 管坑开口＝枕形（玻璃从法兰口里鼓出来） */
  ctx.fillStyle='#000';pillow(ctx,T.x-1,T.y-1,T.w+2,T.h+2,14,3);ctx.fill();
  ctx.fillStyle='#05060a';ctx.fillRect(T.x-3,T.y-3,2,2);ctx.fillRect(T.x+T.w+1,T.y+T.h+1,2,2)}

function drawTube(k,idx,fn){
  const T=TUBE[k],pal=PH[k];
  tubeFrame(k);
  /* 余辉：旧帧向玻璃色衰减——按真实时间归一，120Hz/快进/定格下拖尾长度恒定 */
  const p=T.pctx;
  const fd=1-Math.pow(0.70,Math.max(FR,0));
  if(fd>0){p.fillStyle=`rgba(${pal.fadeC},${fd.toFixed(3)})`;p.fillRect(0,0,T.w,T.h)}
  const saved=ctx;ctx=p;
  const warm=S.phase==='boot'?0:V.warm[k];
  if(warm<=0){}                                       /* 未通电：只余辉衰减 */
  else if(warm<.35){const r2=warm/.35;                 /* 白点 */
    ctx.fillStyle=pal.hot;ctx.globalAlpha=.9;
    ctx.fillRect(T.w/2-1-r2*2,T.h/2-1,2+r2*4,2);ctx.globalAlpha=1}
  else if(warm<.7){const r2=(warm-.35)/.35;            /* 横线展开 */
    ctx.fillStyle=pal.hot;ctx.globalAlpha=.8;
    ctx.fillRect(T.w/2-(T.w/2-6)*r2,T.h/2-1,(T.w-12)*r2,1);ctx.globalAlpha=1}
  else{
    let a=(warm-.7)/.3;
    if(!V.flick[k]&&Math.random()<.0008*FR)V.flick[k]=now;
    if(V.flick[k]){if(now-V.flick[k]<90)a*=.8;else V.flick[k]=0}
    AMUL=a;ctx.globalAlpha=a;fn(pal);AMUL=1;ctx.globalAlpha=1}
  ctx=saved;
  /* 合成：枕形玻璃 → 内缩光栅（四周留未点亮的暗玻璃带） */
  ctx.save();pillow(ctx,T.x,T.y,T.w,T.h,13,2.5);ctx.clip();
  ctx.fillStyle=pal.glass;ctx.fillRect(T.x-3,T.y-3,T.w+6,T.h+6);           /* 暗玻璃底 */
  ctx.save();pillow(ctx,T.x+4,T.y+4,T.w-8,T.h-8,11,2);ctx.clip();          /* 光栅口 */
  ctx.drawImage(T.pc,T.x,T.y);
  ctx.globalAlpha=.11;ctx.fillStyle='#000';                                 /* 扫描线只在光栅内 */
  for(let y=T.y+(idx%2);y<T.y+T.h;y+=2)ctx.fillRect(T.x,y,T.w,1);
  ctx.globalAlpha=1;ctx.restore();
  /* 光栅缘软化：暗带内沿一圈衰减 */
  ctx.globalAlpha=.5;ctx.strokeStyle='#000';ctx.lineWidth=2;
  pillow(ctx,T.x+4,T.y+4,T.w-8,T.h-8,11,2);ctx.stroke();ctx.globalAlpha=1;
  /* 管面中心弧光＋四角衰减 */
  const gg=ctx.createRadialGradient(T.x+T.w/2,T.y+T.h/2,2,T.x+T.w/2,T.y+T.h/2,T.w*.62);
  gg.addColorStop(0,'rgba(255,255,255,.030)');gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gg;ctx.fillRect(T.x,T.y,T.w,T.h);
  for(const [ccx,ccy] of [[T.x+3,T.y+3],[T.x+T.w-3,T.y+3],[T.x+3,T.y+T.h-3],[T.x+T.w-3,T.y+T.h-3]]){
    const cg=ctx.createRadialGradient(ccx,ccy,1,ccx,ccy,15);
    cg.addColorStop(0,'rgba(0,0,0,.5)');cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cg;ctx.fillRect(ccx-15,ccy-15,30,30)}
  const tg=ctx.createLinearGradient(0,T.y,0,T.y+6);
  tg.addColorStop(0,'rgba(0,0,0,.5)');tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tg;ctx.fillRect(T.x,T.y,T.w,6);
  /* 弯玻璃折射高光：沿枕形轮廓，上亮下无 */
  const eg=ctx.createLinearGradient(0,T.y,0,T.y+T.h);
  eg.addColorStop(0,'rgba(255,255,255,.20)');eg.addColorStop(.35,'rgba(255,255,255,.04)');
  eg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.strokeStyle=eg;ctx.lineWidth=1;
  pillow(ctx,T.x+1.5,T.y+1.5,T.w-3,T.h-3,12,2.2);ctx.stroke();
  ctx.restore()}

function bevel(b,label,fill,txtC,fs=13){

  ctx.fillStyle='#000';ctx.fillRect(R(x)+1,R(y)+2,b.w,b.h);
  ctx.fillStyle=fill;ctx.fillRect(R(x),R(y),b.w,b.h-1+pr);
  ctx.globalAlpha=.4*AMUL;ctx.fillStyle='#fff';ctx.fillRect(R(x),R(y),b.w,1);ctx.globalAlpha=AMUL;
  ctx.globalAlpha=.3*AMUL;ctx.fillStyle='#000';ctx.fillRect(R(x),R(y+b.h-2+pr),b.w,1);ctx.globalAlpha=AMUL;
  tx(label,x+b.w/2,y+(b.h-fs)/2-1,fs,txtC,{bold:true,align:'center'})}

  ctx.globalAlpha=1;
  for(let i=V.packs.length-1;i>=0;i--){const k=V.packs[i];

  /* 结算大号浮字（数字物化的落点） */
  for(let i=V.floats.length-1;i>=0;i--){const f=V.floats[i];const p=(now-f.t)/1100;

    if(p>=1){V.ripples.splice(i,1);continue}
    const pe=easeOut(p);
    ctx.globalAlpha=.35*(1-pe);ctx.strokeStyle='#c8dbe6';ctx.strokeRect(R(rp.x-pe*8),R(rp.y-pe*8),R(pe*16),R(pe*16));ctx.globalAlpha=1}

  ctx.restore();
  if(V.flash>0){ctx.globalAlpha=Math.min(1,V.flash);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
const T_A=TUBE.a,T_B=TUBE.b,T_C=TUBE.c;

/* LED 灯条：阶梯（前5琥珀/后5红=深水），右端判定灯 */
function drawLEDs(selftest){
  const L=LEDBAR;
  ctx.fillStyle='#0a0c10';ctx.fillRect(L.x-2,L.y-2,L.w+4,L.h+4);
  for(let i=0;i<10;i++){
    const x=L.x+2+i*17.6,deep=i>=5;
    let on=i<S.fuse;
    if(selftest)on=(now/70|0)%10===i;
    const base=deep?'#2a0e0c':'#241a08';
    const lit=deep?CH.ledR:CH.led;
    ctx.fillStyle=on?lit:base;
    if(i===S.fuse-1&&!selftest&&(now/380|0)%2)ctx.fillStyle=lit;
    ctx.fillRect(R(x),L.y,13,L.h);
    if(on){ctx.globalAlpha=.35;ctx.fillStyle='#fff';ctx.fillRect(R(x),L.y,13,1);ctx.globalAlpha=1}}
  /* 引信口常燃火星：按时间配额发射（帧率无关，定格不堆积） */
  if(!selftest&&FR>0&&now-(V.lastSpark||0)>440){V.lastSpark=now;
    const tipx=L.x+2+(S.fuse-1)*17.6+7+(Math.random()-.5)*6;
    V.parts.push({x:tipx,y:L.y+1,vx:(Math.random()-.5)*.5,vy:-.5-Math.random()*.6,
      l:.85,dl:.028,s:1,c:S.fuse>5?CH.ledR:CH.led});
    if(S.fuse>5)V.parts.push({x:tipx,y:L.y+1,vx:(Math.random()-.5)*.7,vy:-.7-Math.random()*.6,l:.8,dl:.03,s:1,c:'#ff8a5c'})}
  tx('阶梯',L.x,L.y+11,5,'#4a4f58',{mono:true});
  tx('深水',L.x+2+5*17.6,L.y+11,5,S.fuse>5?'#c05a3c':'#4a3a34',{mono:true});
  /* 判定灯 */
  const jx=L.x+L.w-8,jy=L.y+L.h+6;
  ctx.fillStyle=V.judLED?((now/260|0)%2?CH.ledR:'#7a1d16'):'#241012';
  ctx.fillRect(jx,L.y+11,6,4);
  tx('判定',jx-16,L.y+11,5,V.judLED?'#c05a3c':'#4a4f58',{mono:true});
}

/* ── CRT 玻璃（外层整机：微鼓+法兰+眩光，同 M/N） ── */
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;
uniform sampler2D tex;uniform float t,power,glitch,look;uniform vec2 res;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  vec2 vb=(v-.5)*1.045+.5;
  vb.y=(vb.y-.5)/max(power,.001)+.5;
  vec2 c=vb*2.-1.;
  c*=1.+.030*dot(c,c);
  vec2 uv=c*.5+.5;
  vec2 db=max(max(-uv,uv-1.),vec2(0.));
  float edge=1.-smoothstep(.0,.010,max(db.x,db.y));
  uv=clamp(uv,0.,1.);
  uv.x+=(hash(vec2(floor(uv.y*48.),floor(t*24.)))-.5)*glitch*.09;
  vec2 st=vec2(uv.x,1.-uv.y);
  vec2 tp=1./res;
  vec2 sn=(floor(st*res)+.5)*tp;
  vec2 dir=st-.5;
  float ca=.0016+glitch*.006;
  vec3 col;
  col.r=texture2D(tex,sn+dir*ca).r;
  col.g=texture2D(tex,sn).g;
  col.b=texture2D(tex,sn-dir*ca).b;
  vec3 bl=vec3(0.);
  bl+=texture2D(tex,st+vec2( 1.6,0.)*tp).rgb;
  bl+=texture2D(tex,st+vec2(-1.6,0.)*tp).rgb;
  bl+=texture2D(tex,st+vec2(0., 1.6)*tp).rgb;
  bl+=texture2D(tex,st+vec2(0.,-1.6)*tp).rgb;
  bl+=texture2D(tex,st+vec2( 2.6, 2.6)*tp).rgb;
  bl+=texture2D(tex,st+vec2(-2.6, 2.6)*tp).rgb;
  bl+=texture2D(tex,st+vec2( 2.6,-2.6)*tp).rgb;
  bl+=texture2D(tex,st+vec2(-2.6,-2.6)*tp).rgb;
  bl/=8.;
  col+=max(bl-.42,0.)*1.35;
  col*=.95+.05*sin(st.y*res.y*3.14159);
  col*=.96+.04*sin(gl_FragCoord.x*2.094);
  col*=1.+.015*sin(uv.y*7.-t*1.3);
  float vg=1.-smoothstep(.42,1.35,length(c));
  col*=mix(.72,1.12,vg);
  col*=1.08;
  col+=vec3(1.)*(1.-smoothstep(.0,.05,abs(uv.y-.5)))*(1.-power)*1.4;
  col+=(hash(st*res+mod(t*60.,971.))-.5)*.025;
  vec3 bez=vec3(.050,.053,.061)*(1.08-.38*v.y);
  bez+=col*.10;
  col=mix(bez,col,edge);
  float gla=exp(-pow(v.x*.78+v.y*.45-.60-look*.10,2.)*70.);
  col+=vec3(.85,.92,1.)*gla*(.030+.05*(1.-edge));
  gl_FragColor=vec4(col,1.);
}`;
let GLP=null,GLOK=false;
function buildGL(){
  const g=glc.getContext('webgl',{antialias:false});
  if(!g)return null;
  function sh(ty,src){const o=g.createShader(ty);g.shaderSource(o,src);g.compileShader(o);
    if(!g.getShaderParameter(o,g.COMPILE_STATUS))console.error(g.getShaderInfoLog(o));return o}
  const prog=g.createProgram();
  g.attachShader(prog,sh(g.VERTEX_SHADER,VS));g.attachShader(prog,sh(g.FRAGMENT_SHADER,FS));
  g.linkProgram(prog);g.useProgram(prog);
  const buf=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,buf);
  g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
  const locP=g.getAttribLocation(prog,'p');
  g.enableVertexAttribArray(locP);g.vertexAttribPointer(locP,2,g.FLOAT,false,0,0);
  const tex=g.createTexture();
  g.bindTexture(g.TEXTURE_2D,tex);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
  g.uniform2f(g.getUniformLocation(prog,'res'),W,H);
  g.viewport(0,0,glc.width,glc.height);
  return {g,uT:g.getUniformLocation(prog,'t'),uPow:g.getUniformLocation(prog,'power'),
    uGl:g.getUniformLocation(prog,'glitch'),uLook:g.getUniformLocation(prog,'look')}
}
GLP=buildGL();
if(GLP){GLOK=true;
  glc.addEventListener('webglcontextlost',e=>{e.preventDefault();GLOK=false});
  glc.addEventListener('webglcontextrestored',()=>{GLP=buildGL();GLOK=!!GLP});
}else{
  glc.style.display='none';off.style.imageRendering='pixelated';
  document.querySelector('.viewport').appendChild(off);
  const f2=()=>{const s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));
    off.style.width=W*s+'px';off.style.height=H*s+'px'};
  addEventListener('resize',f2);f2();
}
function present(){if(!GLOK||!GLP)return;const g=GLP.g;
  g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,off);
  g.uniform1f(GLP.uT,(now/1000)%120);g.uniform1f(GLP.uPow,V.power);g.uniform1f(GLP.uGl,V.glitch);
  g.uniform1f(GLP.uLook,V.parX||0);
  g.drawArrays(g.TRIANGLES,0,3)}

function loop(ts){const dt=Math.min(50,ts-last);last=ts;
  FR=(dt*timeScale)/16.7;
  stepClock(dt);
  if(S.phase!=='seq'&&S.phase!=='think'&&timeScale>1)timeScale=1;
  draw();present();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

tw({dur:650,apply:p=>{V.power=p}});
at(1150,()=>bootDone());
