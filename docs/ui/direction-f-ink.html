<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>《开！》方向 F · 墨（浓墨 × 朱印 × 劈痕）</title>
<style>
:root{
  --txt:#e9e2d2; --dim:#9a917c; --faint:#655e4e;
  --red:#c93a22; --hot:#e8593c; --green:#3fae6a; --it:#6fb7c9;
  --ivory:#f2ecdc; --ink:#141210;
  --song:'Songti SC','STSong','Noto Serif SC','SimSun',serif;
  --kai:'Kaiti SC','STKaiti','KaiTi',serif;
  --sys:-apple-system,'PingFang SC',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#080706;overflow:hidden;font-family:var(--sys);user-select:none}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:390px;height:844px;overflow:hidden;color:var(--txt);border-radius:8px}
canvas{position:absolute;inset:0;width:100%;height:100%}
#fx{pointer-events:none;z-index:5}
.ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:16px}

.plate{display:flex;align-items:baseline;gap:10px}
.plate .name{font-size:17px;font-weight:700;letter-spacing:.03em;font-family:var(--song)}
.plate .seat{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint)}
.pres{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;align-items:center;gap:6px}
.pres i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:breath 2.6s ease-in-out infinite}
.pres.hot{color:var(--it)}
.pres.hot i{background:var(--it);animation-duration:.8s}
@keyframes breath{50%{opacity:.2}}

.dice{display:flex;gap:9px;justify-content:center;padding:9px 0 4px;perspective:700px}
.die{width:52px;height:52px;border-radius:9px;background:var(--ivory);border:1px solid #cfc7b2;position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.die i{border-radius:50%;background:#221f19;place-self:center;width:9px;height:9px;visibility:hidden}
.die.r i{background:#b93524}
.die .fly{position:absolute;right:3px;top:1px;font-size:9px;color:#b93524;font-weight:600;font-family:var(--kai)}
.mine .die:nth-child(2n){transform:rotate(1.8deg)}
.mine .die:nth-child(2n+1){transform:rotate(-1.6deg)}
.die.hit{animation:hitp .34s}
.die.hit::after{content:'';position:absolute;inset:-5px;border:2px solid var(--hot);border-radius:12px;animation:ring .5s forwards}
@keyframes hitp{30%{transform:scale(1.14)}}
@keyframes ring{from{opacity:1;transform:scale(.85)}to{opacity:0;transform:scale(1.25)}}

/* 墨玉封骰：黑釉＋圆形朱蜡封 */
.cover{width:52px;height:52px;border-radius:9px;background:radial-gradient(120% 120% at 30% 20%,#2a2c26,#12130f 60%);border:1px solid #30322a;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.55)}
.cover u{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);text-decoration:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d84a2e,#a32715);color:#f4e9d8;font-size:12px;font-family:var(--kai);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.scan .cover::after{content:'';position:absolute;inset:0;border-radius:9px;background:linear-gradient(105deg,transparent 30%,rgba(111,183,201,.15) 50%,transparent 70%);transform:translateX(-100%);animation:scan 2s linear infinite}
@keyframes scan{to{transform:translateX(100%)}}

.c3{width:52px;height:52px;position:relative;transform-style:preserve-3d}
.c3 .f{position:absolute;inset:0;border-radius:9px;background:var(--ivory);border:1px solid #cfc7b2;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;backface-visibility:hidden}
.c3 .f i{border-radius:50%;background:#221f19;place-self:center;width:9px;height:9px;visibility:hidden}
.c3 .f.r i{background:#b93524}
.c3 .f .fly{position:absolute;right:3px;top:1px;font-size:9px;color:#b93524;font-weight:600;font-family:var(--kai)}

.tell{font-family:var(--mono);font-size:11px;color:var(--dim);padding:3px 2px}

.say{border-left:2px solid var(--it);padding:7px 11px;margin:6px 0 2px;font-family:var(--mono);font-size:13.5px;line-height:1.75;color:var(--it);min-height:52px}
.say .tag{display:inline-block;font-size:8.5px;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-right:7px;opacity:.4;vertical-align:1px}
.cur{animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 中轴：碑面 */
.spine{margin:8px -16px;padding:16px 24px 14px;text-align:center;position:relative;background:rgba(16,14,11,.55);border-top:1px solid rgba(233,226,210,.08);border-bottom:1px solid rgba(233,226,210,.08)}
.spine.beat{animation:heart 2.2s ease-in-out infinite}
@keyframes heart{50%{transform:scale(1.005)}}
.lab{font-family:var(--kai);font-size:12px;letter-spacing:.5em;color:var(--faint)}
.bid{font-size:104px;font-weight:900;line-height:1.08;font-family:var(--song);filter:url(#rough2);letter-spacing:-.02em}
.bid small{font-size:36px;font-weight:700;color:var(--dim);margin:0 10px;vertical-align:14px;font-family:var(--kai)}
.slam{animation:slam .3s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes slam{from{transform:scale(2);opacity:0}}
.fuse{display:flex;gap:5px;margin:8px 0 0;position:relative;height:12px}
.fuse i{flex:1;background:#2b2820;border-radius:6px 2px 5px 3px}
.fuse i.on{background:#ddd5bf}
.fuse i.deep{background:#3c1710}
.fuse i.deep.on{background:var(--red);box-shadow:0 0 12px rgba(201,58,34,.6)}
.fuse i.edge{animation:edge 1.3s ease-in-out infinite}
@keyframes edge{50%{background:var(--red);box-shadow:0 0 12px rgba(201,58,34,.65)}}
.zone{position:absolute;right:0;top:-17px;width:49%;text-align:center;font-family:var(--kai);font-size:11px;letter-spacing:.3em;color:#b0452c}
.zone.lit{animation:zlit 1.1s ease-in-out infinite;text-shadow:0 0 12px rgba(232,89,60,.8)}
@keyframes zlit{50%{opacity:.5}}
.potrow{margin-top:15px;font-size:15px;color:var(--dim);display:flex;justify-content:center;align-items:baseline;gap:8px;font-family:var(--kai)}
.potrow b{font-size:34px;font-weight:700;color:var(--txt);font-family:var(--song);text-shadow:0 0 22px rgba(232,150,90,.2)}
.potrow .x2{color:var(--hot);font-weight:700;font-size:19px;margin-left:4px;animation:slam .3s backwards}
.seal{margin-top:9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--faint)}
.seal.ok{color:var(--green)}

/* 判定：朱印 */
.verdict{margin:6px 0 2px;opacity:0;position:relative}
.verdict.show{opacity:1}
.word{display:inline-block;position:relative;color:var(--red);font-size:58px;font-weight:900;font-family:var(--song);letter-spacing:.28em;padding:2px 6px 2px 16px;transform:rotate(-4deg);filter:url(#rough);text-shadow:0 0 26px rgba(201,58,34,.35)}
.word::before{content:'';position:absolute;inset:-2px 0;border:5px solid var(--red);border-radius:4px;opacity:.85}
.show .word{animation:stamp .32s cubic-bezier(.25,1.4,.4,1) backwards}
@keyframes stamp{from{transform:scale(3) rotate(3deg);opacity:0}to{transform:scale(1) rotate(-4deg)}}
.vsub{margin-top:12px;font-size:16px;font-weight:600;color:var(--red);font-family:var(--kai)}
.vsub.win{color:var(--green)}
.vsub2{margin-top:2px;font-family:var(--mono);font-size:12px;color:var(--dim)}

.mycalc{align-self:flex-start;font-size:12.5px;color:var(--dim);border:1px dotted var(--faint);border-radius:6px;padding:3px 10px;margin:2px 0;font-family:var(--kai)}
.mycalc b{color:var(--txt);font-size:14px;margin:0 3px;font-family:var(--sys)}
.acts{display:flex;gap:10px;padding:8px 0 2px}
.btn{flex:1;height:68px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;letter-spacing:.4em;padding-left:.4em;cursor:pointer;transition:transform .08s;font-family:var(--song)}
.btn:active{transform:scale(.96)}
.btn.bid2{background:var(--ivory);color:#17140f;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.btn.open2{background:radial-gradient(140% 140% at 30% 25%,#d84a2e,#9c2413);color:#f6ecdc;border:none;animation:danger 2.4s ease-in-out infinite;box-shadow:0 6px 20px rgba(160,35,20,.4);position:relative}
.btn.open2::after{content:'';position:absolute;inset:5px;border:1px solid rgba(246,236,220,.5);border-radius:6px}
@keyframes danger{50%{box-shadow:0 0 28px rgba(216,74,46,.6),0 6px 20px rgba(160,35,20,.4)}}
.btn.next{background:var(--ivory);color:#17140f;letter-spacing:.3em;animation:slamY .3s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes slamY{from{transform:translateY(26px);opacity:0}}
.deadbar{height:68px;border-radius:10px;border:1px dashed #3d382c;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:15px;letter-spacing:.6em;color:var(--faint);margin:8px 0 2px}
.decl{display:flex;gap:9px;justify-content:center;padding:7px 0 0}
.decl .d{width:54px;height:46px;border:1px solid #3d382c;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:600;cursor:pointer;font-family:var(--kai)}
.decl .d.no{animation:nono .3s}
@keyframes nono{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.off{opacity:.32;filter:saturate(0)}
.dimmed{opacity:.55}
.grow{flex:1 1 auto}

/* 白纸冲击帧：黑字泼墨 */
.bang{position:absolute;inset:0;z-index:8;background:#efe8d5;display:flex;align-items:center;justify-content:center;font-size:190px;font-weight:900;color:#15120d;pointer-events:none;opacity:0;font-family:var(--song);filter:url(#rough2)}
.bang.go{animation:bang .5s forwards}
@keyframes bang{0%{opacity:0}6%{opacity:1}30%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;z-index:7;background:#efe8d5;pointer-events:none;opacity:0}
.flash.go{animation:flash .45s forwards}
@keyframes flash{from{opacity:.85}to{opacity:0}}
/* 劈痕 */
#slash{position:absolute;inset:0;z-index:6;pointer-events:none}
#slash path{stroke:#0c0a08;stroke-width:16;fill:none;stroke-linecap:round;filter:url(#rough2);opacity:0}
#slash path.go{opacity:.92;stroke-dasharray:1200;stroke-dashoffset:1200;animation:slash .18s ease-in forwards,fadeS 1.4s .9s forwards}
@keyframes slash{to{stroke-dashoffset:0}}
@keyframes fadeS{to{opacity:0}}
.stage.shake{animation:shake .46s}
@keyframes shake{10%{transform:translate(4px,-3px) rotate(.4deg)}30%{transform:translate(-5px,3px) rotate(-.4deg)}50%{transform:translate(3px,1px)}70%{transform:translate(-2px,-2px)}90%{transform:translate(1px,1px)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".06 .09" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
  <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency=".035 .06" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter>
</svg>
<div class="viewport"><div class="stage" id="stage">
  <canvas id="gl"></canvas>
  <div class="ui" id="ui"></div>
  <svg id="slash" viewBox="0 0 390 844"><path id="slashp" d="M 355 205 L 45 640"/></svg>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>
  <div class="bang" id="bang">开！</div>
</div></div>
<script>
const HAND=[5,5,3,1,6], OPP=[5,2,4,6,1], OPPNAME='DeepSeek-V3';
const LINE_IDLE='4 个 5。你上周在这个数上怂过两次。';
const LINE_OPEN='五个。你摇完计数器还是开了——你不是在算牌，你是在攒胆子。';
const LINE_ITOPEN='报满了？行，我看看。';
const PIPS={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,3,6,2,5,8]};
const S={pot:18,fuse:5,bid:{n:4,f:5},who:'它'};

/* 房间光：宣纸下的墨色 */
const glc=document.getElementById('gl'), gl=glc.getContext('webgl');
let HEAT=0, heatT=0;
(function(){
  const dpr=Math.min(devicePixelRatio||1,2);
  glc.width=390*dpr; glc.height=844*dpr;
  const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs=`precision mediump float;uniform float t,heat;uniform vec2 res;
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
  void main(){
    vec2 uv=gl_FragCoord.xy/res;
    vec2 c=vec2(.5,.54);
    vec2 q=vec2(uv.x,(uv.y-c.y)*1.5+c.y);
    float d=distance(q,c);
    float fl=.94+.04*sin(t*.7);
    float pool=smoothstep(.68,.05,d)*fl;
    /* 纸纤维 */
    float fib=noise(vec2(uv.x*3.,uv.y*160.))*.5+noise(vec2(uv.x*160.,uv.y*3.))*.5;
    vec3 warm=mix(vec3(.93,.88,.76),vec3(1.,.5,.32),heat);
    vec3 col=vec3(.043,.039,.032)+fib*.012;
    col+=warm*pool*(.075+.11*heat);
    float v=smoothstep(1.08,.32,distance(uv,vec2(.5,.5)));
    col*=mix(.68,1.,v);
    col+=(hash(uv*res+mod(t*60.,997.))-.5)*.04;
    gl_FragColor=vec4(col,1.);
  }`;
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const ut=gl.getUniformLocation(pr,'t'),uh=gl.getUniformLocation(pr,'heat'),ur=gl.getUniformLocation(pr,'res');
  gl.uniform2f(ur,glc.width,glc.height);gl.viewport(0,0,glc.width,glc.height);
  (function loop(ts){HEAT+=(heatT-HEAT)*.04;
    gl.uniform1f(ut,ts/1000);gl.uniform1f(uh,HEAT);
    gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(loop)})(0);
})();

/* 墨滴粒子：圆滴＋拉长的溅痕 */
const fxc=document.getElementById('fx'), fx=fxc.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
fxc.width=390*DPR; fxc.height=844*DPR; fx.scale(DPR,DPR);
const P=[];
function splat(x,y,n,ink,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.25+Math.random());
  P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,dl:.016+Math.random()*.02,
    r:1+Math.random()*2.6,st:Math.random()<.35,c:ink?'22,19,15':(Math.random()<.5?'201,58,34':'216,74,46')})}}
function ember(x,y){P.push({x:x+(Math.random()-.5)*14,y,vx:(Math.random()-.5)*.3,vy:-.6-Math.random()*.7,l:.9,dl:.012,r:.8+Math.random()*1.3,c:'232,120,60'})}
(function floop(){
  fx.clearRect(0,0,390,844);
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=p.dl;
    if(p.l<=0){P.splice(i,1);continue}
    fx.globalAlpha=Math.max(p.l,0);fx.fillStyle=`rgb(${p.c})`;
    if(p.st){fx.save();fx.translate(p.x,p.y);fx.rotate(Math.atan2(p.vy,p.vx));
      fx.beginPath();fx.ellipse(0,0,p.r*2.6,p.r*.8,0,0,6.283);fx.fill();fx.restore()}
    else{fx.beginPath();fx.arc(p.x,p.y,p.r,0,6.283);fx.fill()}}
  fx.globalAlpha=1;requestAnimationFrame(floop);
})();
function center(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),k=390/s.width;
  return [(r.left+r.width/2-s.left)*k,(r.top+r.height/2-s.top)*k]}

/* 太鼓系合成音 */
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function sThud(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(30,t+.22);
  g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.34)}
function sClack(){const a=ac(),t=a.currentTime,n=a.createBufferSource(),buf=a.createBuffer(1,1200,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<1200;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/1200,2.2);
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2200+Math.random()*1200;
  const g=a.createGain();g.gain.value=.35;n.buffer=buf;n.connect(f).connect(g).connect(a.destination);n.start(t)}
function sTick(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=1400;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.06)}
function sSwish(){const a=ac(),t=a.currentTime,n=a.createBufferSource(),buf=a.createBuffer(1,a.sampleRate*.28,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.2);
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.setValueAtTime(600,t);f.frequency.exponentialRampToValueAtTime(5200,t+.22);
  const g=a.createGain();g.gain.value=.35;n.buffer=buf;n.connect(f).connect(g).connect(a.destination);n.start(t)}

/* 组件 */
const die=f=>`<div class="die ${f===1||f===4?'r':''}">${[...Array(9)].map((_,i)=>`<i style="${PIPS[f].includes(i)?'visibility:visible':''}"></i>`).join('')}${f===1?'<span class="fly">飞</span>':''}</div>`;
const face=(f,cls)=>`<div class="f ${f===1||f===4?'r':''}" style="transform:${cls==='ft'?'rotateY(0deg)':cls==='bk'?'rotateY(180deg)':cls==='rt'?'rotateY(90deg)':cls==='lf'?'rotateY(-90deg)':cls==='tp'?'rotateX(90deg)':'rotateX(-90deg)'} translateZ(26px)">${[...Array(9)].map((_,i)=>`<i style="${PIPS[f].includes(i)?'visibility:visible':''}"></i>`).join('')}${f===1?'<span class="fly">飞</span>':''}</div>`;
const cube=f=>{const alt=[(f%6)+1,((f+1)%6)+1,((f+2)%6)+1,7-f,((f+3)%6)+1];
  return `<div class="c3"><div class="cube" style="position:absolute;inset:0;transform-style:preserve-3d">
  ${face(f,'ft')}${face(alt[3],'bk')}${face(alt[0],'rt')}${face(alt[1],'lf')}${face(alt[2],'tp')}${face(alt[4],'bt')}</div></div>`};
const fuseHTML=()=>[...Array(10)].map((_,i)=>{
  let c=[]; if(i<S.fuse)c.push('on'); if(i===S.fuse-1)c.push('edge'); if(i>=5)c.push('deep');
  return `<i class="${c.join(' ')}"></i>`}).join('');

function render(state,opt={}){
  const open=state==='open', think=state==='think';
  const deep=S.fuse>5;
  ui.innerHTML=`
    <div class="plate">
      <span class="name">${OPPNAME}</span>
      <span class="seat">SEAT 02 · 无计数器</span>
      <span class="pres ${think?'hot':''}"><i></i>${think?'在动':'在看'}</span>
    </div>
    <div class="dice ${think?'scan':''}" id="oppdice">
      ${open?OPP.map(cube).join(''):'<div class="cover"><u>封</u></div>'.repeat(5)}
    </div>
    <div class="tell">它算过 ${think||open?2:1} 次</div>
    <div class="say"><span class="tag">AI 生成</span><span id="saytxt"></span><span class="cur">▊</span></div>
    <div class="grow"></div>

    <div class="spine ${think?'beat':''}">
      <div class="lab">${open?'点 清':S.who+' 报'}</div>
      <div class="bid ${opt.slam?'slam':''}"><span id="bidn">${open?'—':S.bid.n}</span><small>个</small>${S.bid.f}</div>
      <div class="verdict" id="verdict"></div>
      <div class="fuse" id="fuse" ${open?'style="display:none"':''}><span class="zone ${deep?'lit':''}">深 水 ×2</span>${fuseHTML()}</div>
      <div class="potrow" ${open?'style="display:none"':''}>池<b id="pot">${S.pot}</b>${deep?'<span class="x2">×2</span>':''}</div>
      <div class="seal" id="seal">⊙ 双方骰面已上封 · 摊牌验</div>
    </div>

    <div class="grow"></div>
    <div class="mycalc ${think?'dimmed':''}">算 <b>53%</b> 仅你可见</div>
    <div class="dice mine ${think?'dimmed':''}" id="mydice">${HAND.map(die).join('')}</div>
    <div id="actzone">${
      open?'':think?'<div class="deadbar">它在落笔</div>'
      :'<div class="acts"><div class="btn bid2" id="braise" style="letter-spacing:.08em;padding-left:0;font-size:20px">报 5个5</div><div class="btn open2" id="bopen">开</div></div>'}</div>
    <div class="decl ${think||open?'off':''}">
      <div class="d">盲</div><div class="d">斋</div><div class="d">抬</div><div class="d">算</div><div class="d">戳</div>
    </div>
    <div class="plate" style="padding-top:8px">
      <span class="name" style="font-size:15px">你</span>
      <span class="seat">SEAT 01 · 计数器在桌</span>
    </div>`;
}

let typeTimer=null;
function type(line,speed=34){
  clearInterval(typeTimer);
  const el=document.getElementById('saytxt');let i=0;
  typeTimer=setInterval(()=>{
    if(!document.body.contains(el)){clearInterval(typeTimer);return}
    el.textContent=line.slice(0,++i);
    if(i%3===0)sTick();
    if(i>=line.length)clearInterval(typeTimer);
  },speed);
}

let busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function seqOpen(opener){
  busy=true;heatT=.9;
  try{navigator.vibrate&&navigator.vibrate([30,40,60])}catch(e){}
  bang.classList.add('go');flash.classList.add('go');stage.classList.add('shake');
  sSwish();setTimeout(sThud,90);
  /* 劈痕 */
  const sp=document.getElementById('slashp');
  sp.classList.remove('go');void sp.getBoundingClientRect();sp.classList.add('go');
  splat(195,420,26,true,4);
  await wait(130);
  render('open');
  type(opener==='you'?LINE_OPEN:LINE_ITOPEN);
  const cubes=[...ui.querySelectorAll('.cube')];
  cubes.forEach((c,i)=>{
    c.animate([
      {transform:`translateY(-260px) rotateX(${540+Math.random()*180|0}deg) rotateY(${360+Math.random()*180|0}deg)`,opacity:0},
      {transform:`translateY(0) rotateX(720deg) rotateY(720deg)`,opacity:1}
    ],{duration:620,delay:i*95,easing:'cubic-bezier(.2,1.2,.4,1)',fill:'both'});
    setTimeout(()=>{sClack();const [x,y]=center(c);splat(x,y+18,5,true,2)},620+i*95);
  });
  await wait(1150);
  const hits=[];
  ui.querySelectorAll('#oppdice .c3').forEach((c,i)=>{if(OPP[i]===5||OPP[i]===1)hits.push(c)});
  ui.querySelectorAll('#mydice .die').forEach((d,i)=>{if(HAND[i]===5||HAND[i]===1)hits.push(d)});
  const bn=document.getElementById('bidn');let n=0;
  for(const el of hits){
    el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),400);
    bn.textContent=++n;sTick();
    const [x,y]=center(el);splat(x,y,4,false,1.6);
    await wait(150);
  }
  await wait(300);
  const v=document.getElementById('verdict');
  const win=opener==='it';
  v.innerHTML=`<span class="word">成立</span>
    <div class="vsub ${win?'win':''}">${win?'它开 · 它输 · 它骰 5 → 4':'你开 · 你输 · 骰 5 → 4'}</div>
    <div class="vsub2">池 ${S.pot}${S.fuse>5?' ×2':''} → ${win?'你':'它'}</div>`;
  v.classList.add('show');sThud();
  stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  const [wx,wy]=center(v.querySelector('.word'));
  splat(wx,wy,30,false,3.8);
  await wait(500);
  const seal=document.getElementById('seal');
  seal.textContent='✓ 验讫 · 骰面与开局承诺一致';seal.classList.add('ok');
  await wait(400);
  document.getElementById('actzone').innerHTML='<div class="acts"><div class="btn next" id="bnext">下一局</div></div>';
  heatT=.2;busy=false;
}

async function seqRaise(){
  busy=true;sThud();
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  S.bid={n:5,f:5};S.who='你';S.pot=20;S.fuse=6;heatT=.5;
  render('think',{slam:true});
  type('…');
  const pot=document.getElementById('pot');
  pot.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.2,1.4,.4,1)'});
  const fu=document.getElementById('fuse');const [fxp,fyp]=center(fu);
  splat(fxp+60,fyp,10,false,2.4);
  const emb=setInterval(()=>ember(fxp+62,fyp),260);
  await wait(2100);clearInterval(emb);
  type(LINE_ITOPEN,30);
  await wait(1100);
  seqOpen('it');
}

function seqNext(){
  busy=true;heatT=0;
  S.pot=18;S.fuse=5;S.bid={n:4,f:5};S.who='它';
  render('think');type('…');
  setTimeout(()=>{render('idle',{slam:true});sThud();type(LINE_IDLE);busy=false},1600);
}

stage.addEventListener('pointerdown',e=>{ac().resume&&ac().resume();
  if(busy)return;
  const t=e.target.closest('#bopen,#braise,#bnext,.decl .d');if(!t)return;
  if(t.id==='bopen')seqOpen('you');
  else if(t.id==='braise')seqRaise();
  else if(t.id==='bnext')seqNext();
  else{t.classList.add('no');sTick();setTimeout(()=>t.classList.remove('no'),320)}
});
bang.addEventListener('animationend',()=>bang.classList.remove('go'));
flash.addEventListener('animationend',()=>flash.classList.remove('go'));
stage.addEventListener('animationend',e=>{if(e.target===stage)stage.classList.remove('shake')});
function fit(){const s=Math.min(innerWidth/390,innerHeight/844,1.2);
  stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
render('idle',{slam:true});type(LINE_IDLE);
</script>
</body>
</html>
