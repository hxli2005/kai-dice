<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>《开！》方向 E · 活体样机（WebGL 光场＋粒子＋3D 骰＋合成音）</title>
<style>
:root{
  --txt:#f2ede2; --dim:#a39a88; --faint:#6a6355;
  --red:#d4402c; --hot:#ff6a4e; --green:#43b573; --it:#6fb7c9;
  --ivory:#f6f1e6;
  --sys:-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#050505;overflow:hidden;font-family:var(--sys);user-select:none}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:390px;height:844px;overflow:hidden;color:var(--txt);border-radius:8px}
canvas{position:absolute;inset:0;width:100%;height:100%}
#fx{pointer-events:none;z-index:5}
.ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:16px}

/* ── 名牌 ── */
.plate{display:flex;align-items:baseline;gap:10px}
.plate .name{font-size:17px;font-weight:700;letter-spacing:.03em}
.plate .seat{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint)}
.pres{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;align-items:center;gap:6px}
.pres i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:breath 2.6s ease-in-out infinite}
.pres.hot{color:var(--it)}
.pres.hot i{background:var(--it);animation-duration:.8s}
@keyframes breath{50%{opacity:.2}}

/* ── 骰 ── */
.dice{display:flex;gap:9px;justify-content:center;padding:9px 0 4px;perspective:700px}
.die{width:52px;height:52px;border-radius:10px;background:var(--ivory);border:1px solid #d5cfc2;position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.die i{border-radius:50%;background:#26231e;place-self:center;width:9px;height:9px;visibility:hidden}
.die.r i{background:#c23a2b}
.die .fly{position:absolute;right:3px;top:1px;font-size:9px;color:#c23a2b;font-weight:600}
.mine .die:nth-child(2n){transform:rotate(1.8deg)}
.mine .die:nth-child(2n+1){transform:rotate(-1.6deg)}
.die.hit{animation:hitp .34s}
.die.hit::after{content:'';position:absolute;inset:-5px;border:2px solid var(--hot);border-radius:13px;animation:ring .5s forwards}
@keyframes hitp{30%{transform:scale(1.14)}}
@keyframes ring{from{opacity:1;transform:scale(.85)}to{opacity:0;transform:scale(1.25)}}

/* 封骰：黑漆面＋朱红封签 */
.cover{width:52px;height:52px;border-radius:10px;background:linear-gradient(160deg,#1b1917,#0f0e0d);border:1px solid #2c2823;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.cover u{position:absolute;left:50%;top:-4px;transform:translateX(-50%) rotate(-7deg);text-decoration:none;font-size:10px;color:#e8e2d4;background:var(--red);padding:1px 5px 2px;border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.5);letter-spacing:.06em}
.scan .cover::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(105deg,transparent 30%,rgba(111,183,201,.16) 50%,transparent 70%);transform:translateX(-100%);animation:scan 2s linear infinite}
@keyframes scan{to{transform:translateX(100%)}}

/* 3D 骰 */
.c3{width:52px;height:52px;position:relative;transform-style:preserve-3d}
.c3 .f{position:absolute;inset:0;border-radius:10px;background:var(--ivory);border:1px solid #d5cfc2;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;backface-visibility:hidden}
.c3 .f i{border-radius:50%;background:#26231e;place-self:center;width:9px;height:9px;visibility:hidden}
.c3 .f.r i{background:#c23a2b}
.c3 .f .fly{position:absolute;right:3px;top:1px;font-size:9px;color:#c23a2b;font-weight:600}

.tell{font-family:var(--mono);font-size:11px;color:var(--dim);padding:3px 2px}

/* ── 它的声音 ── */
.say{border-left:2px solid var(--it);padding:7px 11px;margin:6px 0 2px;font-family:var(--mono);font-size:13.5px;line-height:1.75;color:var(--it);min-height:52px}
.say .tag{display:inline-block;font-size:8.5px;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-right:7px;opacity:.4;vertical-align:1px}
.cur{animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ── 中轴 ── */
.spine{margin:8px -16px;padding:16px 24px 14px;text-align:center;position:relative;background:rgba(22,19,15,.62);border-top:1px solid rgba(255,235,200,.07);border-bottom:1px solid rgba(255,235,200,.07);backdrop-filter:blur(2px)}
.spine.beat{animation:heart 2.2s ease-in-out infinite}
@keyframes heart{50%{transform:scale(1.005)}}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.44em;color:var(--faint)}
.bid{font-size:100px;font-weight:800;line-height:1.1;transform:skewX(-5deg);font-variant-numeric:tabular-nums;text-shadow:0 0 38px rgba(255,170,90,.16)}
.bid small{font-size:34px;font-weight:600;color:var(--dim);margin:0 12px;vertical-align:13px}
.slam{animation:slam .34s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes slam{from{transform:skewX(-5deg) scale(1.9);opacity:0}}
.fuse{display:flex;gap:4px;margin:8px 0 0;position:relative;height:12px}
.fuse i{flex:1;border-radius:2px;background:#2a251f}
.fuse i.on{background:#e6e2d6}
.fuse i.deep{background:#361713}
.fuse i.deep.on{background:var(--red);box-shadow:0 0 12px rgba(229,72,60,.6)}
.fuse i.edge{animation:edge 1.3s ease-in-out infinite}
@keyframes edge{50%{background:var(--red);box-shadow:0 0 12px rgba(229,72,60,.65)}}
.zone{position:absolute;right:0;top:-16px;width:49%;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#c4482f}
.zone.lit{animation:zlit 1.1s ease-in-out infinite;text-shadow:0 0 12px rgba(255,90,60,.8)}
@keyframes zlit{50%{opacity:.55}}
.potrow{margin-top:15px;font-size:14px;color:var(--dim);display:flex;justify-content:center;align-items:baseline;gap:8px}
.potrow b{font-size:33px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(255,150,70,.28)}
.potrow .x2{color:var(--hot);font-weight:700;font-size:18px;margin-left:4px;animation:slam .3s backwards}
.seal{margin-top:9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--faint)}
.seal.ok{color:var(--green)}

/* 判定 */
.verdict{margin:8px 0 2px;opacity:0}
.verdict.show{opacity:1}
.word{display:inline-block;position:relative;border:4px solid var(--red);color:var(--red);font-size:32px;font-weight:800;letter-spacing:.5em;padding:5px 10px 5px 22px;border-radius:6px;transform:rotate(-5deg);box-shadow:0 0 34px rgba(229,72,60,.3);text-shadow:0 0 18px rgba(229,72,60,.5)}
.show .word{animation:stamp .34s cubic-bezier(.25,1.4,.4,1) backwards}
@keyframes stamp{from{transform:scale(2.8) rotate(4deg);opacity:0}to{transform:scale(1) rotate(-5deg)}}
.shock{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid var(--hot);border-radius:50%;pointer-events:none;animation:shock .55s ease-out forwards}
@keyframes shock{from{transform:scale(.5);opacity:.9}to{transform:scale(2.6);opacity:0}}
.vsub{margin-top:10px;font-size:16px;font-weight:600;color:var(--red)}
.vsub.win{color:var(--green)}
.vsub2{margin-top:2px;font-family:var(--mono);font-size:12px;color:var(--dim)}

/* ── 你的领地 ── */
.mycalc{align-self:flex-start;font-size:12.5px;color:var(--dim);border:1px dotted var(--faint);border-radius:6px;padding:3px 10px;margin:2px 0}
.mycalc b{color:var(--txt);font-size:14px;margin:0 3px}
.acts{display:flex;gap:10px;padding:8px 0 2px}
.btn{flex:1;height:68px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;letter-spacing:.5em;padding-left:.5em;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.bid2{background:var(--ivory);color:#141210;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.btn.open2{background:linear-gradient(180deg,#d4402c,#a92c1d);color:#fff3ec;border:none;animation:danger 2.4s ease-in-out infinite;box-shadow:0 6px 20px rgba(180,40,25,.35)}
@keyframes danger{50%{box-shadow:0 0 26px rgba(229,72,60,.55),0 6px 20px rgba(180,40,25,.35)}}
.btn.next{background:var(--ivory);color:#141210;letter-spacing:.3em;animation:slamY .3s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes slamY{from{transform:translateY(26px);opacity:0}}
.deadbar{height:68px;border-radius:12px;border:1px dashed #3a352e;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;letter-spacing:.5em;color:var(--faint);margin:8px 0 2px}
.decl{display:flex;gap:9px;justify-content:center;padding:7px 0 0}
.decl .d{width:54px;height:46px;border:1px solid #3a352e;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;cursor:pointer}
.decl .d.no{animation:nono .3s}
@keyframes nono{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.off{opacity:.32;filter:saturate(0)}
.dimmed{opacity:.55}
.grow{flex:1 1 auto}

/* 冲击帧 */
.bang{position:absolute;inset:0;z-index:8;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:170px;font-weight:900;color:#fff;pointer-events:none;opacity:0;letter-spacing:-.04em}
.bang.go{animation:bang .5s forwards}
@keyframes bang{0%{opacity:0}6%{opacity:1}26%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;z-index:7;background:#fff;pointer-events:none;opacity:0}
.flash.go{animation:flash .5s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.stage.shake{animation:shake .46s}
@keyframes shake{10%{transform:translate(4px,-3px) rotate(.4deg)}30%{transform:translate(-5px,3px) rotate(-.4deg)}50%{transform:translate(3px,1px)}70%{transform:translate(-2px,-2px)}90%{transform:translate(1px,1px)}}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <canvas id="gl"></canvas>
  <div class="ui" id="ui"></div>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>
  <div class="bang" id="bang">开！</div>
</div></div>
<script>
/* ══ 数据（与 screens.js 同源）══ */
const HAND=[5,5,3,1,6], OPP=[5,2,4,6,1], OPPNAME='DeepSeek-V3';
const LINE_IDLE='4 个 5。你上周在这个数上怂过两次。';
const LINE_OPEN='五个。你摇完计数器还是开了——你不是在算牌，你是在攒胆子。';
const LINE_ITOPEN='报满了？行，我看看。';   // 样机新增：B 线（它开你）的一句
const PIPS={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,3,6,2,5,8]};
const S={pot:18,fuse:5,bid:{n:4,f:5},who:'它'};

/* ══ WebGL 房间光 ══ */
const glc=document.getElementById('gl'), gl=glc.getContext('webgl');
let HEAT=0, heatT=0;
(function(){
  const dpr=Math.min(devicePixelRatio||1,2);
  glc.width=390*dpr; glc.height=844*dpr;
  const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs=`precision mediump float;uniform float t,heat;uniform vec2 res;
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  void main(){
    vec2 uv=gl_FragCoord.xy/res;
    vec2 c=vec2(.5,.54);
    vec2 q=vec2(uv.x,(uv.y-c.y)*1.5+c.y);
    float d=distance(q,c);
    float fl=.93+.05*sin(t*.8)+.02*sin(t*6.7);
    float pool=smoothstep(.66,.04,d)*fl;
    vec3 warm=mix(vec3(1.,.83,.6),vec3(1.,.47,.3),heat);
    vec3 col=vec3(.030,.028,.025);
    col+=warm*pool*(.105+.115*heat);
    float v=smoothstep(1.08,.32,distance(uv,vec2(.5,.5)));
    col*=mix(.7,1.,v);
    col+=(hash(uv*res+mod(t*60.,997.))-.5)*.05;
    gl_FragColor=vec4(col,1.);
  }`;
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const ut=gl.getUniformLocation(pr,'t'),uh=gl.getUniformLocation(pr,'heat'),ur=gl.getUniformLocation(pr,'res');
  gl.uniform2f(ur,glc.width,glc.height);
  gl.viewport(0,0,glc.width,glc.height);
  (function loop(ts){
    HEAT+=(heatT-HEAT)*.04;
    gl.uniform1f(ut,ts/1000);gl.uniform1f(uh,HEAT);
    gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(loop);
  })(0);
})();

/* ══ 粒子 ══ */
const fxc=document.getElementById('fx'), fx=fxc.getContext('2d');
const DPR=Math.min(devicePixelRatio||1,2);
fxc.width=390*DPR; fxc.height=844*DPR; fx.scale(DPR,DPR);
const P=[];
function burst(x,y,n,c1,c2,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random());
  P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,l:1,dl:.02+Math.random()*.025,r:1+Math.random()*2.2,c:Math.random()<.5?c1:c2})}}
function ember(x,y){P.push({x:x+(Math.random()-.5)*14,y,vx:(Math.random()-.5)*.35,vy:-.5-Math.random()*.8,l:.9,dl:.012,r:.8+Math.random()*1.4,c:'255,140,60'})}
(function floop(){
  fx.clearRect(0,0,390,844);
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=p.dl;
    if(p.l<=0){P.splice(i,1);continue}
    fx.globalAlpha=Math.max(p.l,0);fx.fillStyle=`rgb(${p.c})`;
    fx.beginPath();fx.arc(p.x,p.y,p.r,0,6.283);fx.fill()}
  fx.globalAlpha=1;requestAnimationFrame(floop);
})();
function center(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect(),k=390/s.width;
  return [(r.left+r.width/2-s.left)*k,(r.top+r.height/2-s.top)*k]}

/* ══ 合成音 ══ */
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function sThud(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(38,t+.16);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.26)}
function sClack(){const a=ac(),t=a.currentTime,n=a.createBufferSource(),buf=a.createBuffer(1,1200,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<1200;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/1200,2.2);
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2400+Math.random()*1400;
  const g=a.createGain();g.gain.value=.35;n.buffer=buf;n.connect(f).connect(g).connect(a.destination);n.start(t)}
function sTick(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=1500;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.06)}
function sWhoosh(){const a=ac(),t=a.currentTime,n=a.createBufferSource(),buf=a.createBuffer(1,a.sampleRate*.4,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(6000,t+.3);
  const g=a.createGain();g.gain.value=.4;n.buffer=buf;n.connect(f).connect(g).connect(a.destination);n.start(t)}

/* ══ 组件 ══ */
const die=f=>`<div class="die ${f===1||f===4?'r':''}" data-f="${f}">${[...Array(9)].map((_,i)=>`<i style="${PIPS[f].includes(i)?'visibility:visible':''}"></i>`).join('')}${f===1?'<span class="fly">飞</span>':''}</div>`;
const face=(f,cls)=>`<div class="f ${f===1||f===4?'r':''} ${cls}" style="transform:${cls==='ft'?'rotateY(0deg)':cls==='bk'?'rotateY(180deg)':cls==='rt'?'rotateY(90deg)':cls==='lf'?'rotateY(-90deg)':cls==='tp'?'rotateX(90deg)':'rotateX(-90deg)'} translateZ(26px)">${[...Array(9)].map((_,i)=>`<i style="${PIPS[f].includes(i)?'visibility:visible':''}"></i>`).join('')}${f===1?'<span class="fly">飞</span>':''}</div>`;
const cube=f=>{const alt=[(f%6)+1,((f+1)%6)+1,((f+2)%6)+1,7-f,((f+3)%6)+1];
  return `<div class="c3"><div class="cube" style="position:absolute;inset:0;transform-style:preserve-3d">
  ${face(f,'ft')}${face(alt[3],'bk')}${face(alt[0],'rt')}${face(alt[1],'lf')}${face(alt[2],'tp')}${face(alt[4],'bt')}</div></div>`};
const fuseHTML=()=>[...Array(10)].map((_,i)=>{
  let c=[]; if(i<S.fuse)c.push('on'); if(i===S.fuse-1)c.push('edge'); if(i>=5)c.push('deep');
  return `<i class="${c.join(' ')}"></i>`}).join('');

function render(state,opt={}){
  const open=state==='open', think=state==='think';
  const deep=S.fuse>5;
  ui.innerHTML=`
    <div class="plate">
      <span class="name">${OPPNAME}</span>
      <span class="seat">SEAT 02 · 无计数器</span>
      <span class="pres ${think?'hot':''}"><i></i>${think?'在动':'在看'}</span>
    </div>
    <div class="dice ${think?'scan':''}" id="oppdice">
      ${open?OPP.map(cube).join(''):'<div class="cover"><u>封</u></div>'.repeat(5)}
    </div>
    <div class="tell">它算过 ${think||open?2:1} 次</div>
    <div class="say"><span class="tag">AI 生成</span><span id="saytxt"></span><span class="cur" id="saycur">▊</span></div>
    <div class="grow"></div>

    <div class="spine ${think?'beat':''}">
      <div class="lab">${open?'点 清':S.who+' 报'}</div>
      <div class="bid ${opt.slam?'slam':''}" id="bidline"><span id="bidn">${open?'—':S.bid.n}</span><small>个</small>${S.bid.f}</div>
      <div class="verdict" id="verdict"></div>
      <div class="fuse" id="fuse" ${open?'style="display:none"':''}><span class="zone ${deep?'lit':''}">深 水 ×2</span>${fuseHTML()}</div>
      <div class="potrow" ${open?'style="display:none"':''}>池<b id="pot">${S.pot}</b>${deep?'<span class="x2">×2</span>':''}</div>
      <div class="seal" id="seal">⊙ 双方骰面已上封 · 摊牌验</div>
    </div>

    <div class="grow"></div>
    <div class="mycalc ${think?'dimmed':''}">算 <b>53%</b> 仅你可见</div>
    <div class="dice mine ${think?'dimmed':''}" id="mydice">${HAND.map(die).join('')}</div>
    <div id="actzone">${
      open?'':think?'<div class="deadbar">它 在 动</div>'
      :'<div class="acts"><div class="btn bid2" id="braise">报 5个5</div><div class="btn open2" id="bopen">开</div></div>'}</div>
    <div class="decl ${think||open?'off':''}">
      <div class="d">盲</div><div class="d">斋</div><div class="d">抬</div><div class="d">算</div><div class="d">戳</div>
    </div>
    <div class="plate" style="padding-top:8px">
      <span class="name" style="font-size:15px">你</span>
      <span class="seat">SEAT 01 · 计数器在桌</span>
    </div>`;
  const bb=ui.querySelector('#braise'); if(bb){bb.style.letterSpacing='.1em';bb.style.paddingLeft='0';bb.style.fontSize='19px'}
}

/* 打字机 */
let typeTimer=null;
function type(line,speed=34,done){
  clearInterval(typeTimer);
  const el=document.getElementById('saytxt');let i=0;
  typeTimer=setInterval(()=>{
    if(!document.body.contains(el)){clearInterval(typeTimer);return}
    el.textContent=line.slice(0,++i);
    if(i%3===0)sTick();
    if(i>=line.length){clearInterval(typeTimer);done&&done()}
  },speed);
}

/* ══ 演出序列 ══ */
let busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function seqOpen(opener){
  busy=true;heatT=1;
  try{navigator.vibrate&&navigator.vibrate([30,40,60])}catch(e){}
  bang.classList.add('go');flash.classList.add('go');stage.classList.add('shake');
  sWhoosh();setTimeout(sThud,80);
  await wait(120);
  render('open');
  type(opener==='you'?LINE_OPEN:LINE_ITOPEN);
  /* 3D 翻滚落定 */
  const cubes=[...ui.querySelectorAll('.cube')];
  cubes.forEach((c,i)=>{
    c.animate([
      {transform:`translateY(-260px) rotateX(${540+Math.random()*180|0}deg) rotateY(${360+Math.random()*180|0}deg)`,opacity:0},
      {transform:`translateY(0) rotateX(720deg) rotateY(720deg)`,opacity:1}
    ],{duration:620,delay:i*95,easing:'cubic-bezier(.2,1.2,.4,1)',fill:'both'});
    setTimeout(()=>{sClack();const [x,y]=center(c);burst(x,y+18,6,'200,190,170','120,110,95',2.2)},620+i*95);
  });
  await wait(1150);
  /* 点清：全桌扫计 */
  const hits=[];
  ui.querySelectorAll('#oppdice .c3').forEach((c,i)=>{if(OPP[i]===5||OPP[i]===1)hits.push(c)});
  ui.querySelectorAll('#mydice .die').forEach((d,i)=>{if(HAND[i]===5||HAND[i]===1)hits.push(d)});
  const bn=document.getElementById('bidn');let n=0;
  for(const el of hits){
    el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),400);
    bn.textContent=++n;sTick();
    const [x,y]=center(el);burst(x,y,4,'255,170,80','255,110,60',1.6);
    await wait(150);
  }
  await wait(300);
  /* 盖章 */
  const v=document.getElementById('verdict');
  const win=opener==='it';
  v.innerHTML=`<span class="word">成立</span><span class="shock"></span>
    <div class="vsub ${win?'win':''}">${win?'它开 · 它输 · 它骰 5 → 4':'你开 · 你输 · 骰 5 → 4'}</div>
    <div class="vsub2">池 ${S.pot}${S.fuse>5?' ×2':''} → ${win?'你':'它'}</div>`;
  v.classList.add('show');sThud();stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  const [wx,wy]=center(v.querySelector('.word'));
  burst(wx,wy,26,'255,120,70','229,72,60',3.4);
  await wait(500);
  const seal=document.getElementById('seal');
  seal.textContent='✓ 验讫 · 骰面与开局承诺一致';seal.classList.add('ok');
  await wait(400);
  document.getElementById('actzone').innerHTML='<div class="acts"><div class="btn next" id="bnext">下一局</div></div>';
  heatT=.25;busy=false;
}

async function seqRaise(){
  busy=true;sThud();
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  S.bid={n:5,f:5};S.who='你';S.pot=20;S.fuse=6;heatT=.55;
  render('think',{slam:true});
  type('…');
  const pot=document.getElementById('pot');
  pot.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.2,1.4,.4,1)'});
  const fu=document.getElementById('fuse');const [fxp,fyp]=center(fu);
  burst(fxp+60,fyp,10,'255,120,60','229,72,60',2.4);
  const emb=setInterval(()=>ember(fxp+62,fyp),260);
  await wait(2100);clearInterval(emb);
  type(LINE_ITOPEN,30);
  await wait(1100);
  seqOpen('it');
}

function seqNext(){
  busy=true;heatT=0;
  S.pot=18;S.fuse=5;S.bid={n:4,f:5};S.who='它';
  render('think');type('…');
  setTimeout(()=>{render('idle',{slam:true});sThud();type(LINE_IDLE);busy=false},1600);
}

/* 事件委托 */
stage.addEventListener('pointerdown',e=>{ac().resume&&ac().resume();
  if(busy)return;
  const t=e.target.closest('#bopen,#braise,#bnext,.decl .d');if(!t)return;
  if(t.id==='bopen')seqOpen('you');
  else if(t.id==='braise')seqRaise();
  else if(t.id==='bnext')seqNext();
  else{t.classList.add('no');sTick();setTimeout(()=>t.classList.remove('no'),320)}
});
bang.addEventListener('animationend',()=>bang.classList.remove('go'));
flash.addEventListener('animationend',()=>flash.classList.remove('go'));
stage.addEventListener('animationend',e=>{if(e.target===stage)stage.classList.remove('shake')});

/* 缩放适配 */
function fit(){const s=Math.min(innerWidth/390,innerHeight/844,1.2);
  stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();

/* 开场 */
render('idle',{slam:true});
type(LINE_IDLE);
</script>
</body>
</html>
