# Cloudflare Pages 项目配置（kai-dice）。deploy 用 npm run deploy。
name = "kai-dice"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-01"

# 配额与熔断计数（§9.3/§9.6）
[[kv_namespaces]]
binding = "QUOTA"
id = "082e1ba75a3e41de9066e53c04e7f94b"

# 好友房（Q29）：房间 DO 由 kai-room worker 提供，Pages 站从 /api/room/* 路由进去（同域零 CORS）
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"
script_name = "kai-room"
